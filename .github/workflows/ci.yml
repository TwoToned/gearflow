name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-guard:
    name: Brand Guard (no legacy brand)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check for legacy brand mentions
        run: ./scripts/check-no-gearflow.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://dummy:***@localhost:5432/dummy

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://dummy:***@localhost:5432/dummy

      - name: Run tests (with coverage ratchet)
        run: pnpm test:coverage

  e2e:
    # E2E smoke + a11y over the critical-flows list (POLICY.md R-8.8.3, R-8.1.7).
    # Runs the app against a throwaway Postgres + a dummy Convex URL — critical-flow
    # #1 (login page) renders client-side before any Convex query, so no live backend
    # is needed. Blocking: verified green locally with this exact setup.
    name: E2E (smoke + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gearflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gearflow_ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Sync schema to throwaway DB
        run: pnpm exec prisma db push

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E (chromium)
        run: pnpm exec playwright test --project=chromium
        env:
          BETTER_AUTH_SECRET: ci-e2e-secret-string-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CONVEX_URL: https://dummy-e2e.convex.cloud

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  hygiene:
    # Hygiene gates. The dependency vulnerability scan (R-6.6) is BLOCKING — the tree
    # is clean at high+. The dead-code (R-4.2) and secret (R-7.3) scans start advisory
    # (continue-on-error) so they surface findings without failing CI; flip them blocking
    # once the pre-existing burn-down is cleared. NOT in build's `needs`.
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking (POLICY.md R-6.6 — zero known high/critical at merge). The tree is
      # currently clean at high+; remaining low/moderate advisories are tracked, not gated.
      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level high

      - name: Import-cycle check (new cycles only, R-3.5)
        run: pnpm run depcruise

      - name: Any-ratchet (R-8.2.2)
        run: pnpm run any-ratchet

      - name: Dead-code scan (Knip, advisory)
        run: pnpm run knip
        continue-on-error: true

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Secret scan (gitleaks, advisory)
        run: gitleaks detect --source . --no-git --redact -c .gitleaks.toml
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test]
    # `next build` prerenders DB-backed routes (e.g. the (auth) layout reads
    # siteSettings / SSO providers), so the build needs a reachable database.
    # A throwaway Postgres service + `prisma db push` gives an empty schema
    # matching schema.prisma; the build-time queries return null/[] and succeed.
    # NB: `db push` (not `migrate deploy`) — the migration history isn't
    # replayable from scratch (early tables like crew_role were created via
    # db push and never captured as migrations), so a from-zero `migrate
    # deploy` fails. The build only needs the current schema, which db push
    # provisions directly without touching the (prod-only) migration history.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gearflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gearflow_ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Sync schema to throwaway DB
        run: pnpm exec prisma db push

      - name: Build
        run: pnpm run build
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # Advisory bundle-size budget (POLICY.md R-8.1.5 / T-8). Non-blocking until
      # the current baseline is measured and a real per-route budget registered;
      # flip to blocking (remove continue-on-error) once green.
      - name: Bundle size budget (advisory)
        run: pnpm run size
        continue-on-error: true
