name: Deploy GearFlow
 
on:
  push:
    branches:
      - main
 
jobs:
  deploy:
    name: Pull, Migrate & Restart
    runs-on: self-hosted
    timeout-minutes: 15
 
    steps:
      - name: Pull latest code
        run: |
          cd ${{ vars.APP_DIR }}
          git pull origin main
 
      - name: Install dependencies
        run: |
          cd ${{ vars.APP_DIR }}
          npm ci --ignore-scripts --legacy-peer-deps
 
      - name: Generate Prisma client
        run: |
          cd ${{ vars.APP_DIR }}
          npx prisma generate

      - name: Run tests
        run: |
          cd ${{ vars.APP_DIR }}
          npm test

      - name: Run Prisma migrations
        run: |
          cd ${{ vars.APP_DIR }}
          npx prisma migrate deploy
 
      - name: Build Next.js app
        run: |
          cd ${{ vars.APP_DIR }}
          npm run build
 
      - name: Restart app
        run: pm2 restart gearflow
 
