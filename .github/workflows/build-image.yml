name: Build & Deploy (GHCR + Coolify)

# Replaces the self-hosted main.yml deploy. Builds the production image on
# GitHub's runners (16GB — the 1-2GB prod droplet OOMs on `next build`), pushes
# it to GHCR, then pings Coolify to pull + run it. Migrations run at container
# start (docker-entrypoint.sh), NOT here — the runner can't reach the prod DB.

on:
  push:
    branches: [main]

concurrency:
  # Never run two prod deploys at once; let an in-flight one finish.
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

# Least-privilege default (OSSF Scorecard Token-Permissions); build-and-deploy
# already declares the elevated scope (packages: write) it actually needs.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR requires a lowercase path. Derive it from github.repository so the
      # image path follows the repo automatically across an org/name change
      # (e.g. TwoToned/gearflow -> RVLT-Labs/rvlt-flow) with no edit needed.
      # NOTE at the org move: also re-point Coolify's image source to the new
      # path and reissue its GHCR pull credential — see the rebrand runbook.
      - name: Compute image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # R-2.4: the released artifact (image) must carry the SemVer version too,
      # not just :latest/:sha — otherwise a running deployment can't be traced
      # to a version without a manual SHA->CHANGELOG lookup.
      - name: Read package version
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (for Convex CLI)
        run: pnpm install --frozen-lockfile

      # GATE: push Convex functions + schema to the PROD Cloud deployment. A
      # broken schema/function fails here, before we build or ship any image.
      # CONVEX_DEPLOY_KEY is a prod deploy key (Convex dashboard → Settings).
      - name: Deploy Convex functions
        run: pnpm exec convex deploy -y
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # Drift assertion for the API/MCP contract (design §7). The PR gate builds
      # the registry OFFLINE from the source tree so it needs no deploy key; this
      # is the one place a real deployment exists, so it cross-checks the committed
      # registry against what the deployment actually exposes. A mismatch means the
      # API would either advertise operations that 404 or serve ones nobody
      # reviewed for agent-reachability.
      - name: Cross-check API registry against the deployment
        run: pnpm run api:registry:spec
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ env.PACKAGE_VERSION }}
          # Persist layer cache between runs (GitHub Actions cache backend).
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* are inlined into the client bundle — they MUST be the
          # real prod values here. Server secrets are NOT passed (the Dockerfile
          # uses build-only placeholders; real values come from Coolify at runtime).
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CONVEX_URL=${{ vars.NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_CONFIGURED=${{ vars.NEXT_PUBLIC_GOOGLE_CONFIGURED }}
            NEXT_PUBLIC_MICROSOFT_CONFIGURED=${{ vars.NEXT_PUBLIC_MICROSOFT_CONFIGURED }}
            NEXT_PUBLIC_SITE_ADMIN_REG_ENABLED=${{ vars.NEXT_PUBLIC_SITE_ADMIN_REG_ENABLED }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            POSTHOG_CLI_ENV_ID=${{ vars.POSTHOG_CLI_ENV_ID }}
            POSTHOG_RELEASE_VERSION=${{ github.sha }}
          # POSTHOG_CLI_TOKEN is a write-scoped personal API key — passed as a
          # BuildKit secret mount (below), NOT a build-arg, so it never lands in
          # an image layer or the build cache (unlike build-args, which do).
          secrets: |
            posthog_cli_token=${{ secrets.POSTHOG_CLI_TOKEN }}

      # Tell Coolify to pull the new image and redeploy. This is Coolify's
      # "Deploy Webhook (auth required)" API endpoint (app → Webhooks):
      #   COOLIFY_DEPLOY_WEBHOOK = https://coolify.rvlt.app/api/v1/deploy?uuid=...&force=false
      #   COOLIFY_TOKEN          = a Coolify API token (Coolify → Keys & Tokens → API)
      - name: Trigger Coolify deploy
        run: |
          curl -fsSL --retry 3 -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
