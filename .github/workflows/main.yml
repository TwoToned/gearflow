name: Deploy GearFlow
 
on:
  push:
    branches:
      - main
 
jobs:
  deploy:
    name: Pull, Migrate & Restart
    runs-on: self-hosted
    timeout-minutes: 15
 
    steps:
      - name: Pull latest code
        run: |
          cd ${{ vars.APP_DIR }}
          git pull origin main

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          working_directory: ${{ vars.APP_DIR }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ vars.APP_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          cd ${{ vars.APP_DIR }}
          pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: |
          cd ${{ vars.APP_DIR }}
          pnpm exec prisma generate

      - name: Run tests
        run: |
          cd ${{ vars.APP_DIR }}
          pnpm test

      - name: Run Prisma migrations
        run: |
          cd ${{ vars.APP_DIR }}
          pnpm exec prisma migrate deploy

      - name: Build Next.js app
        run: |
          cd ${{ vars.APP_DIR }}
          pnpm run build
 
      - name: Restart app + Discord bot
        run: |
          cd ${{ vars.APP_DIR }}
          # Web app: unchanged, proven path.
          pm2 restart gearflow
          # Discord bot: separate process. startOrReload starts it on first
          # deploy and gracefully reloads it thereafter (--only scopes to the bot
          # so the web app config above is never touched by this file).
          pm2 startOrReload ecosystem.config.js --only gearflow-discord-bot --update-env
          # Persist the process list so a box reboot brings both back.
          pm2 save
 
