name: Build & Deploy DEV (GHCR + Coolify)

# Static dev environment: same image pipeline as build-image.yml, but pointed at
# the DEV Convex deployment + dev app origin and tagged `:dev`, so AI agents and
# experiments never touch live data. Tracks `main` automatically; run it by hand
# (workflow_dispatch) against any branch to try a change on dev first.
#
# Why a separate image: NEXT_PUBLIC_* are inlined into the client bundle at build
# time, so `:latest` (prod build args) can't be re-pointed at dev by Coolify env.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-and-deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (for Convex CLI)
        run: pnpm install --frozen-lockfile

      # Push functions + schema to the DEV deployment. CONVEX_DEPLOY_KEY_DEV is a
      # DEV deploy key (it cannot reach prod). CONVEX_AUTH_ISSUER/JWKS_URL are read
      # from the dev deployment's own env at push time.
      - name: Deploy Convex functions (dev)
        run: pnpm exec convex dev --once
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
          # Dev origin + dev Convex URL come from DEV_* repo variables. PostHog is
          # left unset (analytics inert) so dev traffic never pollutes prod
          # analytics, and sourcemap upload is off (no token passed).
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.DEV_NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_CONVEX_URL=${{ vars.DEV_NEXT_PUBLIC_CONVEX_URL }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            NEXT_PUBLIC_GOOGLE_CONFIGURED=${{ vars.NEXT_PUBLIC_GOOGLE_CONFIGURED }}
            NEXT_PUBLIC_MICROSOFT_CONFIGURED=${{ vars.NEXT_PUBLIC_MICROSOFT_CONFIGURED }}
            NEXT_PUBLIC_SITE_ADMIN_REG_ENABLED=${{ vars.NEXT_PUBLIC_SITE_ADMIN_REG_ENABLED }}
            POSTHOG_SOURCEMAPS_REQUIRED=false

      # COOLIFY_DEV_DEPLOY_WEBHOOK = the dev app's Coolify deploy webhook URL.
      # COOLIFY_TOKEN is shared with the prod workflow.
      - name: Trigger Coolify deploy (dev)
        run: |
          curl -fsSL --retry 3 -X POST "${{ secrets.COOLIFY_DEV_DEPLOY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
