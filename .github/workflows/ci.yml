name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand-guard:
    name: Brand Guard (no legacy brand)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for legacy brand mentions
        run: ./scripts/check-no-gearflow.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://dummy:***@localhost:5432/dummy

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://dummy:***@localhost:5432/dummy

      - name: Run tests (with coverage ratchet)
        run: pnpm test:coverage

  e2e:
    # E2E smoke + a11y over the critical-flows list (POLICY.md R-8.8.3, R-8.1.7).
    # Runs the app against a throwaway Postgres + a dummy Convex URL — critical-flow
    # #1 (login page) renders client-side before any Convex query, so no live backend
    # is needed. Blocking: verified green locally with this exact setup.
    name: E2E (smoke + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gearflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gearflow_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Sync schema to throwaway DB
        run: pnpm exec prisma db push

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E (chromium)
        run: pnpm exec playwright test --project=chromium
        env:
          BETTER_AUTH_SECRET: ci-e2e-secret-string-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CONVEX_URL: https://dummy-e2e.convex.cloud

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # `e2e-harness` (seeded-auth E2E over the primary revenue path, POLICY.md
  # R-8.8.3, #621) is REMOVED AGAIN (2026-07-23) — still broken, for a different
  # reason than originally suspected. Progress made this pass:
  #   - Root-caused the ORIGINAL red runs (#725) as a Next dev-server crash under
  #     `next dev` (not the docker-in-CI JWKS networking path first suspected) and
  #     fixed it: playwright.config.ts runs a prebuilt `next start` for this job
  #     via E2E_PROD_SERVER=1. Confirmed on a GitHub-hosted runner: the crash is
  #     gone, and 5-6 of 7 harness specs pass reliably now.
  #   - Wrote the 3 remaining unwritten critical flows (#3, #4, #10):
  #     e2e/harness-sign-out.spec.ts, e2e/harness-onboarding.spec.ts,
  #     e2e/harness-create-inventory.spec.ts.
  #   - Found a SECOND, distinct bug: e2e/harness-revenue-path.spec.ts's warehouse
  #     "Prep" step leaves a dialog open that intercepts pointer events for every
  #     click afterward, so the test hangs retrying a swallowed click for its full
  #     timeout (up to 3 attempts x 240s) instead of failing fast — not yet
  #     root-caused. This job was pulled again rather than left burning ~15-20 CI
  #     minutes on every PR for a guaranteed-red job with no gating value (it was
  #     already continue-on-error: true, so it wasn't even blocking).
  # See docs/e2e-harness.md to restore it — the specs (e2e/harness-*.spec.ts) and
  # scripts (scripts/e2e-harness-{up,down}.sh) are untouched, only this job
  # definition was pulled. Registered as a dated exception in docs/exceptions.md
  # (R-8.8.3).

  integration:
    # Integration tests against a real migrated Postgres (POLICY.md R-10.1, R-8.8).
    # Postgres-only mode: INTEGRATION_CONVEX is unset, so the Convex-service-token
    # suites self-skip (their trust chain needs private dev infra that must not be
    # exposed to CI — same opt-in shape as the E2E_HARNESS specs). Blocking:
    # verified green locally with this exact setup.
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gearflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gearflow_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations to the test DB
        run: pnpm exec prisma migrate deploy

      - name: Run integration tests (Postgres-only)
        run: pnpm test:integration:pg

  hygiene:
    # Hygiene gates. BLOCKING: dependency vuln scan (R-6.6), secret scan (R-7.3),
    # import-cycle (R-3.5), any-ratchet (R-8.2.2), unbounded-read ratchet (R-9.8),
    # dead-code ratchet (Knip, R-4.2), complexity ratchet (R-3.6 — blocking on any
    # increase). NOT in build's `needs`.
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the migration-drift gate can merge-base against origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking (POLICY.md R-6.6 — zero known high/critical at merge). The tree is
      # currently clean at high+; remaining low/moderate advisories are tracked, not gated.
      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level high

      - name: Migration drift (schema.prisma needs a migration, R-8.3.1)
        run: |
          git fetch --no-tags --depth=100 origin main:refs/remotes/origin/main || git fetch --no-tags origin main
          pnpm run check-migration-drift

      - name: Docs npm/npx contradiction check (new only, R-5.3)
        run: pnpm run check-docs-npm-npx

      - name: Import-cycle ratchet (R-3.5 — blocking on any increase)
        run: pnpm run depcruise-ratchet

      - name: Any-ratchet (R-8.2.2)
        run: pnpm run any-ratchet

      - name: Unbounded-read ratchet (R-9.8)
        run: pnpm run collect-ratchet

      - name: Dead-code ratchet (Knip, R-4.2 — blocking on any increase)
        run: pnpm run knip-ratchet
        # Knip loads prisma.config.ts, which reads DATABASE_URL — without it Knip emits
        # phantom "unresolved imports" and the count diverges from local. A dummy value
        # just needs to resolve (no connection).
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Complexity ratchet (R-3.6 — blocking on any increase)
        run: pnpm run complexity-ratchet

      - name: Client-boundary justification (R-8.1.1)
        run: pnpm run check-client-routes

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --no-git --redact -c .gitleaks.toml

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test]
    # `next build` prerenders DB-backed routes (e.g. the (auth) layout reads
    # siteSettings / SSO providers), so the build needs a reachable database.
    # A throwaway Postgres service + `prisma db push` gives an empty schema
    # matching schema.prisma; the build-time queries return null/[] and succeed.
    # NB: `db push` (not `migrate deploy`) — the migration history isn't
    # replayable from scratch (early tables like crew_role were created via
    # db push and never captured as migrations), so a from-zero `migrate
    # deploy` fails. The build only needs the current schema, which db push
    # provisions directly without touching the (prod-only) migration history.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gearflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gearflow_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Sync schema to throwaway DB
        run: pnpm exec prisma db push

      - name: Build
        run: pnpm run build
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # Bundle-size budget (POLICY.md R-8.1.5 / T-8) — BLOCKING regression gate on the
      # entry route's First Load JS (gzip). Fails if it grows >5% past the baseline.
      - name: Bundle-size ratchet (R-8.1.5)
        run: pnpm run bundle-ratchet

      # CSS bundle budget (POLICY.md R-8.7.5 / T-8) — BLOCKING absolute cap (50KB
      # gzip) on .next/static/css/*.css, checked via size-limit (.size-limit.json).
      # Was previously a dead script never invoked from CI (#623).
      - name: CSS bundle budget (R-8.7.5)
        run: pnpm run size
