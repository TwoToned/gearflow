<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>/tmp/ex/a.html</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500..900&family=Hanken+Grotesk:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: the RVLT Flow app shell (220 rail · 56 top bar) around one list card; phone < 860 swaps the table for 56px rows, a bottom nav and sheets. Single dark (Espresso) look, the product's own. */
:root{
  --paper:#141210;--paper-2:#1a1613;--card:#211c17;--elev:#2a241d;
  --ink:#f5efe2;--ink-2:#cdc4b2;--muted:#9e9483;--faint:#6e665a;
  --line:#332c24;--line-2:#473e32;--control-line:#857a69;
  --red:#e0363d;--red-700:#b21f26;--action-red:#d6323a;
  --info:#82a8f3;--ok:#4fd888;--warn:#eba53a;--rep:#b6ac9a;--t-out:#f26f73;--teal:#3fc8be;--amber:#eba53a;--purple:#9b82e6;--blue:#5b8def;--green:#3ecf7a;
  --ok-soft:rgba(62,207,122,.14);--warn-soft:rgba(235,165,58,.15);--rep-soft:rgba(158,148,131,.14);--out-soft:rgba(224,54,61,.18);--blue-soft:rgba(91,141,239,.15);--amber-soft:rgba(235,165,58,.15);--purple-soft:rgba(155,130,230,.15);--teal-soft:rgba(63,200,190,.15);
  --scrim:rgba(14,12,10,.66);--select:rgba(224,54,61,.20);--dark:#0e0c0a;
  --sh-card:0 3px 0 #0c0a08;--sh-hover:0 7px 0 #0c0a08;--lit:inset 0 1px 0 rgba(255,253,248,.14);
  --r:14px;--r-lg:20px;--r-pill:999px;
  --display:"Archivo",system-ui,sans-serif;--sans:"Hanken Grotesk",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
a{color:var(--blue);text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--info);outline-offset:2px}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--control-line);border-radius:10px;height:36px;padding:0 12px}
svg{display:block;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-micro{font-size:11px;font-weight:500;line-height:1.3}
.t-small{font-size:12px;font-weight:500;line-height:1.4}
.t-overline{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
/* shell */
.app{display:flex;height:100%}
.sidebar{width:220px;flex:none;background:var(--paper-2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-left:max(0px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:15px}
.brand .r{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;background:var(--action-red);color:#fff;font-family:var(--display);font-weight:900;font-size:14px}
.brand .flow{color:var(--red)}
.nav{display:flex;flex-direction:column;gap:2px;padding:12px 10px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.nav a.on{background:var(--blue-soft);color:var(--info);box-shadow:var(--sh-card)}
.nav .patch{display:inline-flex;width:16px;height:16px;border-radius:5px}
.sidebar .foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.content{flex:1;min-height:0;overflow:auto;padding:20px 24px 24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:16px;align-items:flex-start}
.page{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.h1{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0;text-wrap:balance}
/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--r-pill);font-size:14px;font-weight:600;white-space:nowrap;line-height:1}
.btn-primary{background:var(--action-red);color:#fff;box-shadow:0 3px 0 var(--red-700),var(--lit)}
.btn-secondary{background:var(--card);color:var(--ink);border:2px solid var(--line-2);box-shadow:var(--sh-card)}
.btn-ghost{color:var(--ink-2)}
.btn-sm{height:30px;padding:0 12px;font-size:13px}
.btn-lg{height:44px;padding:0 20px;font-size:15px}
.btn-icon{width:36px;padding:0;color:var(--ink-2)}
.btn-icon.btn-sm{width:30px}
.btn:active{transform:translateY(1px)}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:var(--r-pill);font-size:11px;font-weight:700;line-height:1;white-space:nowrap}
.pill-ok{background:var(--ok-soft);color:var(--ok)}.pill-warn{background:var(--warn-soft);color:var(--warn)}.pill-err{background:var(--out-soft);color:var(--t-out)}.pill-info{background:var(--blue-soft);color:var(--info)}
.pill-outline{border:1px solid var(--line-2);color:var(--ink-2);height:20px;padding:0 7px;font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;height:18px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:600;line-height:1;background:var(--paper-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.tag-kit{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.tag-grp{background:var(--blue-soft);color:var(--info);border-color:transparent}
.tag-sub{background:var(--purple-soft);color:var(--purple);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line-2);color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--elev);color:var(--ink);box-shadow:var(--lit);border-color:var(--control-line)}
.tabs{display:flex;gap:2px;padding:3px;background:var(--paper-2);border-radius:var(--r-pill);border:1px solid var(--line)}
.tab{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:var(--r-pill);font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--elev);color:var(--ink);box-shadow:var(--lit)}
.tab .cnt{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:5px;background:var(--paper-2);border:1px solid var(--line-2);border-bottom-width:2px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--control-line);background:var(--paper-2);flex:none;display:inline-block;position:relative;vertical-align:middle;cursor:pointer}
tr:hover .cb,.cb:hover,.dlg .cb{border-color:var(--ink-2)}
.tbl tr.child td:first-child{padding-left:20px}
.cb.on{background:var(--action-red);border-color:var(--action-red)}
.cb.on::after{content:"";position:absolute;left:3.5px;top:0.5px;width:4px;height:7px;border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.sw{display:inline-flex;align-items:center;width:34px;height:20px;border-radius:999px;background:var(--line-2);padding:2px;flex:none;cursor:pointer}
.sw i{display:block;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:margin .15s}
.sw.on{background:var(--action-red)}.sw.on i{background:#fff;margin-left:14px}
.hr{height:1px;background:var(--line)}
/* card + table */
.card{background:var(--card);border:2px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-card);display:flex;flex-direction:column;overflow:hidden}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--control-line);color:var(--muted);font-size:13px;width:200px}
.search input{border:0;background:none;height:28px;padding:0;flex:1;min-width:0;font-size:13px}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.sel td{background:var(--select)}
.tbl tr.child td{background:rgba(255,253,248,.025);color:var(--ink-2)}
.tbl tr.sect th{background:var(--paper-2);border-top:1px solid var(--line);padding:9px 12px;cursor:pointer;user-select:none}
.tbl tr.row:hover td{background:var(--elev)}
.tbl tr.row td:first-child{box-shadow:inset 3px 0 0 var(--line-2)}
.tbl tr.row:hover td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.cellbtn{cursor:text;border-radius:6px;padding:3px 6px;margin:-3px -6px;display:inline-block;min-width:28px;text-align:inherit}
.cellbtn:hover{background:var(--paper-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.cellbtn.name{cursor:text;padding:2px 4px;margin:-2px -4px;min-width:0}
.inl{height:28px;width:90px;padding:0 8px;border-radius:8px;font-family:var(--mono);font-size:13px;text-align:right;background:var(--paper-2);border:1px solid var(--info);box-shadow:0 0 0 3px var(--blue-soft)}
.inl.name{width:100%;min-width:160px;text-align:left;font-family:var(--sans);font-weight:600}
.inl.wide{width:120px}
.stepper.sm{height:30px;border-radius:8px}.stepper.sm button{width:30px;font-size:16px}.stepper.sm input{width:40px;font-size:13px}
.grip{cursor:grab;color:var(--faint);font-size:14px;line-height:1;width:12px;flex:none;opacity:0;user-select:none}
tr:hover .grip,.lrow:hover .grip{opacity:1}
tr.dragging td,.lrow.dragging{opacity:.4}
tr.drop-before td{box-shadow:inset 0 2px 0 var(--red)}tr.drop-after td{box-shadow:inset 0 -2px 0 var(--red)}
tr.drop-before td:first-child{box-shadow:inset 3px 0 0 var(--line-2),inset 0 2px 0 var(--red)}tr.drop-after td:first-child{box-shadow:inset 3px 0 0 var(--line-2),inset 0 -2px 0 var(--red)}
tr.drop-into td,tr.drop-into th,.lhead.drop-into,.lrow.drop-into{background:var(--select)!important}
.lrow.drop-before{box-shadow:inset 0 2px 0 var(--red)}.lrow.drop-after{box-shadow:inset 0 -2px 0 var(--red)}
.title{display:flex;align-items:center;gap:8px;min-width:0}
.title b{font-weight:600}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.chev{color:var(--muted);cursor:pointer;flex:none}
.rowact{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.dots{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--faint)}
.dots:hover{background:var(--paper-2);color:var(--ink)}
.ghost{color:var(--muted);height:28px;padding:0;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ghost:hover{color:var(--ink)}
.cardfoot{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);background:var(--paper-2);flex-wrap:wrap}
/* phone list */
.list{display:none}
.lrow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 12px 8px 16px;border-top:1px solid var(--line);background:var(--paper);width:100%;text-align:left;color:inherit}
.lrow.child{padding-left:40px;background:rgba(255,253,248,.025);color:var(--ink-2);min-height:44px}
.lrow.sel{background:var(--select)}
.lrow .grow{flex:1;min-width:0}
.lhead{display:flex;align-items:center;gap:8px;height:36px;padding:0 16px;background:var(--paper-2);border-top:1px solid var(--line);font-size:12px;font-weight:700;width:100%;text-align:left;color:inherit}
/* rail + drawer */
.rail{flex:none;display:flex;flex-direction:column;gap:4px;padding:6px 4px;margin-top:112px;border:1px solid var(--line);border-radius:12px;background:var(--paper-2);position:sticky;top:112px}
.rail button{position:relative;width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.rail button:hover,.rail button.on{background:var(--elev);color:var(--ink)}
.rail .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.drawer{flex:none;width:300px;display:none;flex-direction:column;gap:12px;margin-top:112px}
.drawer.open{display:flex}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
/* popover / menu / sheet */
.layer{position:fixed;inset:0;z-index:50;display:none}
.layer.open{display:block}
.layer .scrim{position:absolute;inset:0;background:transparent}
.layer.dim .scrim{background:var(--scrim)}
.menu{position:absolute;width:260px;padding:6px;background:var(--elev);border:2px solid var(--line-2);border-radius:var(--r);box-shadow:var(--sh-hover);display:flex;flex-direction:column}
.menu .hd{font-size:11px;font-weight:600;color:var(--muted);padding:6px 10px 4px}
.menu .sh{font-size:11px;font-weight:600;color:var(--faint);padding:8px 10px 2px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--ink);text-align:left}
.menu button:hover{background:var(--paper-2)}
.menu button.danger{color:var(--t-out)}
.menu button .kbd{margin-left:auto}
.menu .hr{margin:4px 0}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--card);border:2px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--sh-hover);display:flex;flex-direction:column;overflow:hidden}
.dlg .hd{padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.dlg .hd h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.02em;margin:4px 0 0}
.dlg .bd{padding:14px 22px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg .ft{display:flex;align-items:center;gap:8px;padding:12px 22px;border-top:1px solid var(--line);background:var(--paper-2)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--control-line);border-radius:10px;overflow:hidden;height:36px}
.stepper button{width:40px;height:100%;font-size:18px;color:var(--ink-2)}
.stepper button:hover{background:var(--paper-2)}
.stepper input{width:56px;text-align:center;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;height:100%}
.sheetwrap{position:absolute;left:0;right:0;bottom:0;max-height:88%;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line-2);border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -3px 0 #0c0a08;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheetwrap .grab{width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:10px auto 6px;flex:none}
.sheetwrap .item{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 20px;font-size:15px;font-weight:500;text-align:left}
.sheetwrap .item.danger{color:var(--t-out)}
.sheetwrap .hd{font-size:11px;font-weight:600;color:var(--muted);padding:8px 20px 4px}
.sheetwrap .sh{font-size:11px;font-weight:600;color:var(--faint);padding:10px 20px 2px}
.sheetwrap .hr{margin:4px 0}
.sheetwrap .kbd{display:none}
/* add popover */
.addpop{position:absolute;width:min(460px,calc(100% - 32px));padding:8px;background:var(--elev);border:2px solid var(--line-2);border-radius:var(--r);box-shadow:var(--sh-hover)}
.addpop .in{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;background:var(--card);border:1px solid var(--control-line)}
.addpop .in input{border:0;background:none;flex:1;min-width:0;height:36px;padding:0}
.addpop .res{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:10px;width:100%;text-align:left;color:inherit}
.addpop .res.on,.addpop .res:hover{background:var(--select)}
/* bulk bar + toast */
.bulk{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:8px 8px 8px 16px;background:var(--elev);border:2px solid var(--line-2);border-radius:var(--r-pill);box-shadow:var(--sh-hover);z-index:40;max-width:calc(100% - 32px)}
.bulk.open{display:flex}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:10px 12px 10px 16px;background:var(--elev);border:2px solid var(--line-2);border-radius:var(--r);box-shadow:var(--sh-hover);z-index:45;font-size:13.5px;max-width:calc(100% - 32px)}
.toast.open{display:flex}
/* phone */
.bottomnav{display:none;height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--line);background:var(--paper-2);flex:none}
.bottomnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.bottomnav a.on{color:var(--red)}
.bottomnav .scan{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--action-red);color:#fff;box-shadow:0 3px 0 var(--red-700),var(--lit);margin-top:-18px}
.phonehead{display:none}
.phoneonly{display:none!important}
#selbtn.on{color:var(--red)}
@media (max-width:859px){
  .sidebar,.rail,.drawer,.deskhead,.tblwrap,.cardfoot .desk{display:none!important}
  .list{display:block}
  .phonehead{display:flex;align-items:center;gap:8px;height:56px;padding:0 8px 0 4px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);flex:none}
  .topbar{display:none}
  .content{padding:0;display:block;overflow:auto}
  .page{gap:0}
  .card{border:0;border-radius:0;box-shadow:none;background:var(--paper)}
  .toolbar{padding:8px 16px}
  .toolbar .tab{padding:0 10px}
  .deskonly,.toolbar [data-act="listopts"]{display:none!important}
  .phoneonly{display:inline-flex!important}
  .search{width:auto;flex:1 1 100%;order:9}
  .bottomnav{display:flex}
  .cardfoot{position:sticky;bottom:0}
  .bulk,.toast{bottom:calc(72px + env(safe-area-inset-bottom,0px))}
  .dlg{top:auto;left:0;right:0;bottom:0;transform:none;width:100%;max-height:92%;border-radius:20px 20px 0 0;border-bottom:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2 additions */
.tier{display:inline-flex;align-items:center;height:16px;padding:0 5px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.tier.d{color:var(--teal);border-color:rgba(63,200,190,.4)}.tier.o{color:var(--purple);border-color:rgba(155,130,230,.4)}
.tbl tr.acc td{background:rgba(63,200,190,.04);font-size:13px}
.vc{width:18px;height:18px;border-radius:50%;border:2px solid var(--control-line);display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;background:var(--card);color:var(--dark);padding:0}
.vc.on{background:var(--ok);border-color:var(--ok)}
.vc.x{border-color:var(--line-2);background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line-2) 3px 4px)}

const condWord = a => `<span class="${a.condition==='Needs repair'?'dotw err':a.condition==='Poor'?'dotw warn':'muted'}" style="font-size:12.5px">${a.condition}</span>`;
const flags = a => { const b = []; if (a.status === 'DEPLOYED' && a.job && a.job.num === '#2314') b.push('<span class="dotw err">job overdue</span>'); return b.length ? ` <span style="display:inline-flex;gap:10px;margin-left:8px">${b.join('')}</span>` : ''; };
function renderTable() {
  const all = rows(), pageRows = all.slice(state.page * state.size, (state.page + 1) * state.size), allSel = pageRows.length && pageRows.every(a => state.selected.has(a.id));
  const cols = 10 + Object.values(state.cols).filter(Boolean).length;
  let h = `<table class="tbl" style="min-width:0;table-layout:fixed;width:100%"><colgroup><col style="width:34px"><col style="width:150px"><col><col style="width:110px"><col style="width:120px"><col style="width:96px"><col style="width:140px"><col style="width:140px">${state.cols.value?'<col style="width:90px">':''}${state.cols.tags?'<col style="width:110px">':''}${state.cols.owner?'<col style="width:120px">':''}<col style="width:150px"><col style="width:40px"></colgroup><thead><tr><th><button class="cb ${allSel?'on':''}" data-act="selall" aria-label="Select page"></button></th>${sortHead('Tag','tag')}${sortHead('Model','model')}${sortHead('Serial','serial')}${sortHead('Status','status')}${sortHead('Condition','condition')}${sortHead('Location','location')}${sortHead('Next due','due')}${state.cols.value?sortHead('Value','value','r'):''}${state.cols.tags?'<th>Tags</th>':''}${state.cols.owner?'<th>Owner</th>':''}${sortHead('On job','job')}<th></th></tr></thead><tbody>`;
  if (!pageRows.length) h += `<tr><td colspan="${cols}"><div class="empty">${state.q || Object.values(state.f).some(v => v.length) ? `<b>No assets match that</b>Loosen a filter or clear them. <button class="lnk" data-act="clearf">Clear filters</button>` : state.group === 'attention' ? `<b>Nothing needs attention</b>No missing gear, nothing overdue for test &amp; tag, nothing marked for repair.` : `<b>No assets yet</b>Add gear one at a time or import a spreadsheet. <button class="lnk" data-act="new">New asset</button> · <button class="lnk" data-act="noop">Import CSV</button>`}</div></td></tr>`;
  let lastG = null;
  for (const a of pageRows) {
    if (state.groupBy && a[state.groupBy] !== lastG) { lastG = a[state.groupBy]; const cnt = all.filter(x => x[state.groupBy] === lastG).length; h += `<tr class="grp"><td colspan="${cols}">${esc(lastG)}<span class="n">${cnt}</span></td></tr>`; }
    const sel = state.selected.has(a.id);
    h += `<tr class="row ${sel?'sel':''}" data-act="open" data-id="${a.id}"><td><button class="cb ${sel?'on':''}" data-act="select" data-id="${a.id}" aria-label="Select ${esc(a.tag)}"></button></td><td><span class="ib" style="gap:10px">${thumb(a)}<span class="mono" style="font-size:12.5px">${esc(a.tag)}</span></span></td><td style="min-width:0"><div class="ell"><b style="font-weight:600">${esc(a.model)}</b>${a.kind==='BULK'?` <span class="faint t-small">· ${a.qty - a.out} of ${a.qty} in</span>`:''}${flags(a)}</div><div class="sub ell">${esc(a.category)}${a.tags.length && !state.cols.tags ? ` · <span class="faint">${a.tags.join(', ')}</span>` : ''}</div></td><td class="mono t-small muted">${a.serial ? esc(a.serial) : '<span class="faint">bulk</span>'}</td><td>${statusWord(a)}</td><td>${condWord(a)}</td><td class="t-small"><div class="ell">${esc(a.location)}</div>${a.shelf?`<div class="sub ell">${esc(a.shelf)}</div>`:''}</td><td>${dueCell(a)}</td>${state.cols.value?`<td class="r mono t-small">${money(a.value)}</td>`:''}${state.cols.tags?`<td class="t-small muted">${a.tags.join(', ')||'—'}</td>`:''}${state.cols.owner?`<td class="t-small muted">${esc(a.owner)}</td>`:''}<td class="t-small">${a.job ? `<a class="lnk" href="${OV}" style="font-weight:500"><span class="mono muted">${esc(a.job.num)}</span> <span class="ell" style="max-width:100px;display:inline-block;vertical-align:bottom">${esc(a.job.name)}</span></a>` : '<span class="faint">—</span>'}</td><td class="r"><button class="dots" data-act="rowmenu" data-id="${a.id}" aria-label="Asset actions">${ICON.dots}</button></td></tr>`;
  }
  $('#tblwrap').innerHTML = h + '</tbody></table>'; $('#grid').innerHTML = ''; $('#tblwrap').style.display = '';
}
function renderGrid() {
  const all = rows(), pageRows = all.slice(state.page * state.size, (state.page + 1) * state.size);
  $('#tblwrap').style.display = 'none';
  $('#grid').innerHTML = `<div class="agrid">${pageRows.map(a => { const sel = state.selected.has(a.id); return `<div class="acard ${sel?'sel':''}" data-act="open" data-id="${a.id}"><div class="aimg ${a.img?'img':''}"><button class="cb ${sel?'on':''}" data-act="select" data-id="${a.id}" aria-label="Select ${esc(a.tag)}"></button>${a.img ? '' : `<span class="faint" style="font-family:var(--mono);font-size:11px">${esc(a.category)}</span>`}<button class="dots" data-act="rowmenu" data-id="${a.id}" aria-label="Asset actions">${ICON.dots}</button></div><div class="abody"><div class="ell" style="font-weight:600">${esc(a.model)}</div><div class="sub ell"><span class="mono">${esc(a.tag)}</span> · ${esc(a.location)}${a.shelf?' · '+esc(a.shelf):''}</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">${statusWord(a)}${overdue(a)?dueCell(a):''}</div></div></div>`; }).join('') || `<div class="empty"><b>No assets match that</b><button class="lnk" data-act="clearf">Clear filters</button></div>`}</div>`;
}
function renderList() {
  const all = rows(), pageRows = all.slice(0, (state.page + 1) * state.size);
  $('#list').innerHTML = pageRows.map(a => { const sel = state.selected.has(a.id); return `<div class="lrow ${sel?'sel':''}" data-act="open" data-id="${a.id}"><button class="cb ${sel?'on':''}" data-act="select" data-id="${a.id}" aria-label="Select"></button>${thumb(a)}<div class="grow" style="min-width:0"><div class="ttl ell">${esc(a.model)}</div><div class="sub ell"><span class="mono">${esc(a.tag)}</span> · ${a.job ? esc(a.job.num) + ' ' + esc(a.job.name) : esc(a.location) + (a.shelf ? ' · ' + esc(a.shelf) : '')}</div>${overdue(a) || a.condition === 'Needs repair' ? `<div class="sub" style="display:flex;gap:10px">${overdue(a)?dueCell(a):''}${a.condition==='Needs repair'?condWord(a):''}</div>` : ''}</div><div class="right">${statusWord(a)}</div></div>`; }).join('') || `<div class="empty"><b>No assets match that</b><button class="lnk" data-act="clearf">Clear filters</button></div>`;
  if (all.length > pageRows.length) $('#list').innerHTML += `<button class="lrow" data-act="more" style="justify-content:center;color:var(--blue);font-weight:600">Show ${Math.min(state.size, all.length - pageRows.length)} more · ${all.length - pageRows.length} left</button>`;
}
function renderFoot() { $('#foot').innerHTML = pager(rows().length, 'assets'); }
function renderBulk() { const n = state.selected.size, b = $('#bulk'); b.classList.toggle('open', n > 0); document.body.classList.toggle('hassel', n > 0); if (!n) return; const sel = state.assets.filter(a => state.selected.has(a.id)), out = sel.filter(a => a.status === 'DEPLOYED').length; b.innerHTML = `<b style="font-size:13px">${n} selected</b><button class="btn btn-secondary btn-sm" data-act="bulkedit">Edit…</button><button class="btn btn-secondary btn-sm" data-act="bulkmove">Move to…</button><button class="btn btn-secondary btn-sm" data-act="bulktag">Add tag…</button><button class="btn btn-secondary btn-sm deskonly" data-act="bulklabels">Print labels</button><button class="btn btn-secondary btn-sm" data-act="bulkmaint">Schedule service</button>${out ? `<button class="btn btn-secondary btn-sm" data-act="bulkreturn">Force return ${out}</button>` : ''}<button class="btn btn-secondary btn-sm" style="color:var(--t-out)" data-act="bulkretire">Retire</button><button class="btn btn-icon btn-sm" data-act="clearsel" aria-label="Clear selection">✕</button>`; }
// ---------- actions
function multiMenu(el, key, title, options) { openMenu(el, title, [...options.map(o => ({label:o, act:'ftoggle', args:`data-k="${key}" data-v="${o}"`, on:state.f[key].includes(o)})), '-', {label:'Clear', act:'fclear', args:`data-k="${key}"`}]); }
function act(name, el, ev) {
  const id = el.dataset.id, a = id ? asset(id) : null;
  switch (name) {
    case 'close': closeLayer(); break;
    case 'noop': closeLayer(); toast('Not wired in this prototype'); break;
    case 'new': closeLayer(); toast('Opens the New asset form · model first, then tag, serial, location'); break;
    case 'scan': closeLayer(); toast(isPhone() ? 'Opens the camera · scanning a tag jumps straight to that asset' : 'Focuses search · a USB scanner types the tag and Enter opens the asset'); if (!isPhone()) $('#q').focus(); break;
    case 'view': state.view = el.dataset.v; render(); break;
    case 'group': state.group = el.dataset.k; state.page = 0; render(); break;
    case 'sort': if (state.sort === el.dataset.k) state.dir = state.dir === 'asc' ? 'desc' : 'asc'; else { state.sort = el.dataset.k; state.dir = 'asc'; } render(); break;
    case 'page': state.page = Math.max(0, state.page + +el.dataset.d); render(); break;
    case 'more': state.page++; render(); break;
    case 'fmenu': { const k = el.dataset.k; if (k === 'model') multiMenu(el, 'model', 'Model', models()); if (k === 'category') multiMenu(el, 'category', 'Category', cats()); if (k === 'location') multiMenu(el, 'location', 'Location', locs()); if (k === 'condition') multiMenu(el, 'condition', 'Condition', ['Good','Fair','Poor','Needs repair']); break; }
    case 'ftoggle': { const arr = state.f[el.dataset.k], v = el.dataset.v, i = arr.indexOf(v); i >= 0 ? arr.splice(i,1) : arr.push(v); state.page = 0; state.savedView = null; render(); act('fmenu', el); break; }
    case 'fclear': state.f[el.dataset.k] = []; closeLayer(); render(); break;
    case 'kindmenu': openMenu(el, 'Kind', [['','Serialised and bulk'],['SERIALISED','Serialised only'],['BULK','Bulk only']].map(([v,l]) => ({label:l, act:'kindset', args:`data-v="${v}"`, on:state.f.kind===v}))); break;
    case 'kindset': state.f.kind = el.dataset.v; state.page = 0; closeLayer(); render(); break;
    case 'groupmenu': openMenu(el, 'Group rows by', [['','None'],['model','Model'],['location','Location'],['category','Category']].map(([v,l]) => ({label:l, act:'groupset', args:`data-v="${v}"`, on:state.groupBy===v}))); break;
    case 'groupset': state.groupBy = el.dataset.v; closeLayer(); render(); break;
    case 'clearf': state.f = { model:[], category:[], location:[], condition:[], kind:'' }; state.q = ''; $('#q').value = ''; state.savedView = null; state.page = 0; closeLayer(); render(); break;
    case 'viewsmenu': openMenu(el, 'Views', [{sh:'Saved views · each one is a URL you can share'}, ...VIEWS.map((v,i) => ({label:v.name, act:'applyview', args:`data-i="${i}"`, on:state.savedView===v.name})), '-', {label:'Save current view…', act:'saveview'}, ...(state.savedView ? [{label:'Clear view', act:'clearf'}] : [])]); break;
    case 'applyview': { const v = VIEWS[+el.dataset.i]; state.f = { model:[], category:[], location:[], condition:[], kind:'', ...(v.f||{}) }; state.group = v.group || 'all'; state.savedView = v.name; state.page = 0; closeLayer(); render(); toast(`View “${v.name}” · the filters are in the URL, so the link is the view`); break; }
    case 'saveview': closeLayer(); openDialog(`<div class="hd"><div class="t-overline">Views</div><h2 style="font-size:18px">Save current view</h2></div><div class="bd">${field('Name', `<input id="v-name" placeholder="e.g. Audio on the floor" value="">`)}<label class="ib t-small" style="gap:8px;margin-top:10px;cursor:pointer"><span class="sw" data-act="sw"><i></i></span>Make this my default for Assets</label></div><div class="ft"><div style="flex:1"></div><button class="btn btn-secondary" data-act="close">Cancel</button><button class="btn btn-primary" data-act="saveviewgo">Save</button></div>`, d => $('#v-name', d).focus()); break;
    case 'sw': el.classList.toggle('on'); break;
    case 'saveviewgo': { const nm = $('#v-name', body).value.trim() || 'Untitled view'; VIEWS.push({ name:nm, f:{ ...state.f }, group:state.group }); state.savedView = nm; closeLayer(); render(); toast(`Saved “${nm}”`); break; }
    case 'pagemenu': openMenu(el, 'Assets', [{label:'Models', act:'noop', small:'18'},{label:'Kits', act:'noop', small:'6'},{label:'Locations', act:'noop'},'-',{label:'Import CSV…', act:'noop'},{label:'Export this view (CSV)', act:'noop'},{label:'Print labels for this view', act:'noop'},'-',{label:'Columns', act:'colsmenu'},{label:'Show retired', act:'showretired', on:state.group==='retired'}]); break;
    case 'colsmenu': openMenu(el, 'Columns', [{label:'Value', act:'coltoggle', args:'data-c="value"', on:state.cols.value},{label:'Tags', act:'coltoggle', args:'data-c="tags"', on:state.cols.tags},{label:'Owner', act:'coltoggle', args:'data-c="owner"', on:state.cols.owner},{sh:'Tag, model, serial, status, condition, location, next due and job are always shown'}]); break;
    case 'coltoggle': state.cols[el.dataset.c] = !state.cols[el.dataset.c]; closeLayer(); render(); break;
    case 'showretired': state.group = state.group === 'retired' ? 'all' : 'retired'; closeLayer(); render(); break;
    case 'open': if (ev && ev.target.closest('.cb,.dots,a')) break; closeLayer(); toast(`Opens ${esc(a.tag)} · ${esc(a.model)}`); break;
    case 'select': { if (ev && ev.shiftKey && state.lastSel) { const order = rows().map(x => x.id), i1 = order.indexOf(state.lastSel), i2 = order.indexOf(id); for (const k of order.slice(Math.min(i1,i2), Math.max(i1,i2)+1)) state.selected.add(k); } else state.selected.has(id) ? state.selected.delete(id) : state.selected.add(id); state.lastSel = id; render(); break; }
    case 'selall': { const pr = rows().slice(state.page * state.size, (state.page + 1) * state.size); const all = pr.every(x => state.selected.has(x.id)); pr.forEach(x => all ? state.selected.delete(x.id) : state.selected.add(x.id)); render(); break; }
    case 'clearsel': state.selected.clear(); render(); break;
    case 'rowmenu': openMenu(el, `${a.tag} · ${a.model}`, [{label:'Open', act:'open', args:`data-id="${a.id}"`},{label:'Edit…', act:'noop'},...(a.job ? [{label:`Job ${a.job.num}`, href:OV, small:'Overview'}] : []),'-',{label:'Move to…', act:'movemenu', args:`data-id="${a.id}"`},{label:'Schedule service…', act:'maintone', args:`data-id="${a.id}"`},{label:'Print label', act:'noop'},{label:'Duplicate…', act:'noop'},'-',...(a.status === 'DEPLOYED' ? [{label:'Force return', act:'returnone', args:`data-id="${a.id}"`}] : []),{label:a.status === 'RETIRED' ? 'Reinstate' : 'Retire…', act:'retireone', args:`data-id="${a.id}"`, danger:a.status !== 'RETIRED'}]); break;
    case 'movemenu': openMenu(el, `Move ${a.tag} to`, locs().filter(l => l !== 'On job').map(l => ({label:l, act:'moveone', args:`data-id="${a.id}" data-v="${l}"`, on:a.location===l}))); break;
    case 'moveone': { const undo = snapshot(); a.location = el.dataset.v; closeLayer(); render(); toast(`${esc(a.tag)} moved to ${esc(a.location)}`, undo); break; }
    case 'maintone': { const undo = snapshot(); a.maintDue = addD(TODAY, 3); a.status = a.status === 'AVAILABLE' ? 'IN_MAINTENANCE' : a.status; closeLayer(); render(); toast(`Service scheduled for ${esc(a.tag)} · ${fmtD(a.maintDue)}`, undo); break; }
    case 'returnone': { const undo = snapshot(); a.status = 'AVAILABLE'; a.job = null; a.location = 'Warehouse A'; closeLayer(); render(); toast(`${esc(a.tag)} returned to Warehouse A · the job's line keeps its history`, undo); break; }
    case 'retireone': { const undo = snapshot(); a.status = a.status === 'RETIRED' ? 'AVAILABLE' : 'RETIRED'; closeLayer(); render(); toast(a.status === 'RETIRED' ? `${esc(a.tag)} retired · hidden from availability, history kept` : `${esc(a.tag)} reinstated`, undo); break; }
    case 'bulkedit': closeLayer(); openDialog(`<div class="hd"><div class="t-overline">${state.selected.size} assets</div><h2 style="font-size:18px">Edit together</h2></div><div class="bd" style="display:grid;gap:12px">${field('Condition', `<select id="b-cond">${opt('', 'Leave as is')}${['Good','Fair','Poor','Needs repair'].map(c => opt(c, c)).join('')}</select>`)}${field('Owner', `<select id="b-owner">${opt('', 'Leave as is')}${opt('Owned','Owned')}${opt('Sub-hire (Chameleon)','Sub-hire (Chameleon)')}</select>`)}<div class="t-micro muted">Only the fields you change are written · tag and serial stay unique per asset</div></div><div class="ft"><div style="flex:1"></div><button class="btn btn-secondary" data-act="close">Cancel</button><button class="btn btn-primary" data-act="bulkeditgo">Save</button></div>`); break;
    case 'bulkeditgo': { const c = $('#b-cond', body).value, o = $('#b-owner', body).value; const undo = snapshot(); const cnt = state.selected.size; state.assets.forEach(x => { if (state.selected.has(x.id)) { if (c) x.condition = c; if (o) x.owner = o; } }); state.selected.clear(); closeLayer(); render(); toast(`${cnt} assets updated`, undo); break; }
    case 'bulkmove': openMenu(el, `Move ${state.selected.size} to`, locs().filter(l => l !== 'On job').map(l => ({label:l, act:'bulkmovego', args:`data-v="${l}"`}))); break;
    case 'bulkmovego': { const undo = snapshot(); const cnt = state.selected.size; state.assets.forEach(x => { if (state.selected.has(x.id) && x.status !== 'DEPLOYED') x.location = el.dataset.v; }); state.selected.clear(); closeLayer(); render(); toast(`${cnt} assets moved to ${esc(el.dataset.v)} · deployed ones stay on their job`, undo); break; }
    case 'bulktag': closeLayer(); openDialog(`<div class="hd"><div class="t-overline">${state.selected.size} assets</div><h2 style="font-size:18px">Add a tag</h2></div><div class="bd">${field('Tag', `<input id="t-tag" placeholder="e.g. touring" value="">`)}</div><div class="ft"><div style="flex:1"></div><button class="btn btn-secondary" data-act="close">Cancel</button><button class="btn btn-primary" data-act="bulktaggo">Add</button></div>`, d => $('#t-tag', d).focus()); break;
    case 'bulktaggo': { const t = $('#t-tag', body).value.trim(); if (!t) break; const undo = snapshot(); const cnt = state.selected.size; state.assets.forEach(x => { if (state.selected.has(x.id) && !x.tags.includes(t)) x.tags.push(t); }); state.selected.clear(); closeLayer(); render(); toast(`“${t}” added to ${cnt} assets`, undo); break; }
    case 'bulklabels': { const cnt = state.selected.size; closeLayer(); toast(`Label sheet for ${cnt} assets · opens the print dialog`); break; }
    case 'bulkmaint': { const undo = snapshot(); const cnt = state.selected.size; state.assets.forEach(x => { if (state.selected.has(x.id)) { x.maintDue = addD(TODAY, 3); if (x.status === 'AVAILABLE') x.status = 'IN_MAINTENANCE'; } }); state.selected.clear(); closeLayer(); render(); toast(`Service scheduled for ${cnt} assets · ${fmtD(addD(TODAY, 3))}`, undo); break; }
    case 'bulkreturn': { const undo = snapshot(); let cnt = 0; state.assets.forEach(x => { if (state.selected.has(x.id) && x.status === 'DEPLOYED') { x.status = 'AVAILABLE'; x.job = null; x.location = 'Warehouse A'; cnt++; } }); state.selected.clear(); closeLayer(); render(); toast(`${cnt} assets force-returned to Warehouse A`, undo); break; }
    case 'bulkretire': { const cnt = state.selected.size; closeLayer(); openDialog(`<div class="hd"><div class="t-overline">Retire</div><h2 style="font-size:18px">Retire ${cnt} assets?</h2></div><div class="bd"><div class="t-small" style="line-height:1.5">Retired gear leaves availability and every picker, but keeps its history, documents and test &amp; tag record. Anything currently on a job is skipped. You can reinstate from the Retired segment.</div></div><div class="ft"><div style="flex:1"></div><button class="btn btn-secondary" data-act="close">Keep them</button><button class="btn btn-secondary" style="color:var(--t-out)" data-act="bulkretirego">Retire ${cnt}</button></div>`); break; }
    case 'bulkretirego': { const undo = snapshot(); let cnt = 0; state.assets.forEach(x => { if (state.selected.has(x.id) && x.status !== 'DEPLOYED') { x.status = 'RETIRED'; cnt++; } }); state.selected.clear(); closeLayer(); render(); toast(`${cnt} assets retired`, undo); break; }
    case 'undo': if (state.undo) { state.undo(); state.undo = null; } $('#toast').classList.remove('open'); break;
    case 'toastclose': $('#toast').classList.remove('open'); break;
  }
}
document.addEventListener('input', ev => { if (ev.target.id === 'q') { state.q = ev.target.value; state.page = 0; state.savedView = null; render(); } });
render();

</script>
