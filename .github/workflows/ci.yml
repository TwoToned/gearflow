name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (OSSF Scorecard Token-Permissions). Jobs that need
# more (e.g. hygiene's PR-comment posting) declare their own override below.
permissions:
  contents: read

jobs:
  brand-guard:
    name: Brand Guard (no legacy brand)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for legacy brand mentions
        run: ./scripts/check-no-gearflow.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://dummy:***@localhost:5432/dummy

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://dummy:***@localhost:5432/dummy

      - name: Run tests (with coverage ratchet)
        run: pnpm test:coverage

  e2e:
    # E2E smoke + a11y over the critical-flows list (POLICY.md R-8.8.3, R-8.1.7).
    # Runs the app against a throwaway Postgres + a dummy Convex URL — critical-flow
    # #1 (login page) renders client-side before any Convex query, so no live backend
    # is needed. Blocking: verified green locally with this exact setup.
    name: E2E (smoke + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gearflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gearflow_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Sync schema to throwaway DB
        run: pnpm exec prisma db push

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E (chromium)
        run: pnpm exec playwright test --project=chromium
        env:
          BETTER_AUTH_SECRET: ci-e2e-secret-string-at-least-32-characters
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_CONVEX_URL: https://dummy-e2e.convex.cloud

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-harness:
    # Seeded-auth E2E over the primary revenue path (POLICY.md R-8.8.3, #621):
    # sign-in/register, onboarding, sign-out, create-inventory, project -> line
    # items -> availability -> check-out -> return. Needs a REAL Convex backend
    # (unlike the `e2e` job's dummy Convex URL) because these flows write and read
    # actual domain data. Runs a self-hosted Convex backend in Docker against its
    # own Postgres db on the same service Postgres instance, exactly as documented
    # in docs/e2e-harness.md / scripts/e2e-harness-up.sh.
    #
    # RESTORED (2026-07-25, #858): both prior blockers are now fixed.
    #   - Original red runs (#725): root-caused as a Next dev-server crash under
    #     `next dev` (not the docker-in-CI JWKS networking path first suspected).
    #     E2E_PROD_SERVER (playwright.config.ts) runs a prebuilt `next start`
    #     instead, sidestepping the on-demand compilation entirely.
    #   - Second bug (#753): e2e/harness-revenue-path.spec.ts's warehouse "Prep"/
    #     "Deploy" steps could leave an "Assign assets" dialog open (a combobox to
    #     pick the specific serial, appearing even with only one candidate asset,
    #     on timing that looks tied to an async per-item check) that intercepted
    #     pointer events for every click afterward. The spec now handles the
    #     dialog for real instead of never filling it. A separate Playwright
    #     locator-retry race on the project-creation wizard's rapid 3x-Continue
    #     `.click()` sequence (unrelated to the dialog — the project was already
    #     being created successfully, `.click()` just never resolved) is sidestepped
    #     with `.focus()+Enter`. Verified with 4 consecutive clean local runs
    #     (~10s each, vs. the previous 240s timeouts) before restoring this job.
    name: E2E (seeded harness — revenue path)
    runs-on: ubuntu-latest
    # 20, not the usual 15: the revenue-path test alone can take up to 3
    # attempts (2 retries) at up to 240s each under CI load — see its
    # test.setTimeout comment. A hard job timeout here would cancel the whole
    # job mid-run rather than let it report a clean pass/fail.
    timeout-minutes: 20
    # NOT blocking yet: re-added after fixing the stuck-dialog bug that made it
    # guaranteed-red, but that fix hasn't been proven on a GitHub-hosted runner
    # yet (only verified locally, 4/4 clean runs). Flip this off once a run
    # (ideally a few in a row) has gone green here.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gearflow_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gearflow_harness
      BETTER_AUTH_SECRET: ci-e2e-harness-secret-string-at-least-32-chars
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_DB: gearflow_harness
      E2E_PROD_SERVER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Sync schema to throwaway DB
        run: pnpm exec prisma db push

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Stand up the seeded Convex harness
        # Writes NEXT_PUBLIC_CONVEX_URL to .env.local — MUST run before the build
        # step below, since NEXT_PUBLIC_* vars are inlined into the client bundle
        # at build time, not read at server start.
        run: bash scripts/e2e-harness-up.sh

      - name: Build (prebuilt `next start` for the harness — see job comment)
        run: pnpm run build

      - name: Run E2E (seeded harness, chromium)
        run: pnpm exec playwright test --project=chromium e2e/harness-auth.spec.ts e2e/harness-a11y.spec.ts e2e/harness-cookie-flags.spec.ts e2e/harness-onboarding.spec.ts e2e/harness-sign-out.spec.ts e2e/harness-create-inventory.spec.ts e2e/harness-revenue-path.spec.ts
        env:
          E2E_HARNESS: "1"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-harness-report
          path: playwright-report/
          retention-days: 7

      - name: Tear down the seeded Convex harness
        if: always()
        run: bash scripts/e2e-harness-down.sh

  integration:
    # Integration tests against a real migrated Postgres (POLICY.md R-10.1, R-8.8).
    # Postgres-only mode: INTEGRATION_CONVEX is unset, so the Convex-service-token
    # suites self-skip (their trust chain needs private dev infra that must not be
    # exposed to CI — same opt-in shape as the E2E_HARNESS specs). Blocking:
    # verified green locally with this exact setup.
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gearflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gearflow_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Apply migrations to the test DB
        run: pnpm exec prisma migrate deploy

      - name: Run integration tests (Postgres-only)
        run: pnpm test:integration:pg

  hygiene:
    # Hygiene gates. BLOCKING: dependency vuln scan (R-6.6), secret scan (R-7.3),
    # import-cycle (R-3.5), any-ratchet (R-8.2.2), inline display-date-format ratchet
    # (I3, #1082), unbounded-read ratchet (R-9.8), dead-code ratchet (Knip, R-4.2),
    # complexity ratchet (R-3.6), cross-tenant by_cuid guard ratchet (#1076, A6),
    # new-dependency justification (R-6.3 — blocking on any increase). NOT in build's
    # `needs`.
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # soft PR-size comment (R-2.8) needs to post/update a comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the migration-drift gate can merge-base against origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking (POLICY.md R-6.6 — zero known high/critical at merge). The tree is
      # currently clean at high+; remaining low/moderate advisories are tracked, not gated.
      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level high

      - name: Migration drift (schema.prisma needs a migration, R-8.3.1)
        run: |
          git fetch --no-tags --depth=100 origin main:refs/remotes/origin/main || git fetch --no-tags origin main
          pnpm run check-migration-drift

      - name: Docs npm/npx contradiction check (full repo, R-5.3)
        run: pnpm run check-docs-npm-npx

      - name: New-dependency justification (R-6.3)
        run: pnpm run check-dependency-justification
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

      - name: Import-cycle ratchet (R-3.5 — blocking on any increase)
        run: pnpm run depcruise-ratchet

      - name: Any-ratchet (R-8.2.2)
        run: pnpm run any-ratchet

      - name: Date-format ratchet (I3, #1082 — blocking on any increase)
        run: pnpm run date-format-ratchet

      - name: Unbounded-read ratchet (R-9.8)
        run: pnpm run collect-ratchet

      - name: Dead-code ratchet (Knip, R-4.2 — blocking on any increase)
        run: pnpm run knip-ratchet
        # Knip loads prisma.config.ts, which reads DATABASE_URL — without it Knip emits
        # phantom "unresolved imports" and the count diverges from local. A dummy value
        # just needs to resolve (no connection).
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Complexity ratchet (R-3.6 — blocking on any increase)
        run: pnpm run complexity-ratchet

      - name: Cross-tenant by_cuid guard ratchet (#1076, A6 — blocking on any increase)
        run: pnpm run xtenant-bycuid-ratchet

      - name: Client-boundary justification (R-8.1.1)
        run: pnpm run check-client-routes

      # API/MCP contract gates (#997, design §6/§7). One command covers three of
      # the four: regenerate the registry offline (no deployment, no
      # CONVEX_DEPLOY_KEY — it reads the Convex validators in-process), then fail
      # if (a) a new privileged argument has no policy row, (b) the agent-reachable
      # count dropped below the committed floor, or (c) the committed registry /
      # coverage table are stale. Gate 4, the runtime probe that checks the
      # statically-extracted (resource, action) against what the guard actually
      # enforces, runs in the test job (convex/agentRegistryProbe.test.ts) because
      # it needs a Convex runtime.
      #
      # It also prints docs/api-coverage.md's table on every PR, which is how the
      # SERVICE-only count stays visible instead of drifting.
      - name: API registry + coverage + privileged-arg gates (#997)
        run: pnpm run api:registry:check

      # OpenAPI 3.1 + llms.txt staleness gate (#998, design §11). Regenerated
      # from the SAME registry the step above just verified is current, so this
      # can only drift if someone edits the committed output by hand.
      - name: API docs (OpenAPI + llms.txt) staleness gate (#998)
        run: pnpm run api:docs:check

      # MCP tool manifest staleness gate (#999, design §7/§12). The explicit
      # fix for the previous build's "MCP tool-list drift" finding: the
      # curated tool set, schemas, and descriptions are regenerated from the
      # SAME registry the step above verified, so a stale manifest — an agent
      # being told a tool exists that doesn't, or with a schema that no
      # longer matches what dispatch() accepts — fails CI instead of shipping.
      - name: MCP tool manifest staleness gate (#999)
        run: pnpm run api:mcp:check

      # Mira's feature-map staleness gate (FEATUREDOCS/68) — the feature list in
      # her system prompt is a pure derivation of ARCHITECTURE.md's FEATUREDOCS
      # table (not a hand-copied second list), so it can only drift if someone
      # edits the committed output by hand instead of adding a feature doc row.
      - name: Mira feature-map staleness gate
        run: pnpm run mira:feature-map:check

      - name: Print API coverage table
        if: always()
        run: sed -n '/## Totals/,/reachability-floor/p' docs/api-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Secret scan (gitleaks)
        run: gitleaks detect --source . --no-git --redact -c .gitleaks.toml

      # SHOULD-level (R-2.8, T-2), non-blocking: reports changed LOC and flags
      # PRs over the ≤400-LOC target with a soft comment instead of a CI gate.
      - name: PR size check (R-2.8)
        id: pr-size
        run: pnpm run pr-size-check

      - name: Comment on oversized PR (R-2.8 — advisory only)
        if: steps.pr-size.outputs.over_budget == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = "<!-- pr-size-check -->";
            const changedLoc = "${{ steps.pr-size.outputs.changed_loc }}";
            const body = `${marker}\n**PR size:** ${changedLoc} changed LOC — over the POLICY.md ` +
              "R-2.8 / T-2 SHOULD-level target (≤ 400 LOC, target 200-400 LOC, excluding R-0.5 " +
              "exclusions). This is advisory only, not a gate — consider splitting if practical, " +
              "or note a size rationale in the PR body.";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test]
    # `next build` prerenders DB-backed routes (e.g. the (auth) layout reads
    # siteSettings / SSO providers), so the build needs a reachable database.
    # A throwaway Postgres service + `prisma db push` gives an empty schema
    # matching schema.prisma; the build-time queries return null/[] and succeed.
    # NB: `db push` (not `migrate deploy`) — the migration history isn't
    # replayable from scratch (early tables like crew_role were created via
    # db push and never captured as migrations), so a from-zero `migrate
    # deploy` fails. The build only needs the current schema, which db push
    # provisions directly without touching the (prod-only) migration history.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gearflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gearflow_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Sync schema to throwaway DB
        run: pnpm exec prisma db push

      - name: Build
        run: pnpm run build
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      # Bundle-size budget (POLICY.md R-8.1.5 / T-8) — BLOCKING regression gate on the
      # entry route's First Load JS (gzip). Fails if it grows >5% past the baseline.
      - name: Bundle-size ratchet (R-8.1.5)
        run: pnpm run bundle-ratchet

      # CSS bundle budget (POLICY.md R-8.7.5 / T-8) — BLOCKING absolute cap (50KB
      # gzip) on .next/static/css/*.css, checked via size-limit (.size-limit.json).
      # Was previously a dead script never invoked from CI (#623).
      - name: CSS bundle budget (R-8.7.5)
        run: pnpm run size
