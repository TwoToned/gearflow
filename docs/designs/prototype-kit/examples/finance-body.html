<style>
/* Finance hub · money words, Xero note, ghost rows */
.mwords{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line);padding:2px 0 14px}
.mw{display:block;text-align:left;padding:4px 20px 4px 0;color:inherit;min-width:0}
.mw .l{font-size:12px;font-weight:600;color:var(--muted)}
.mw .num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:24px;font-weight:500;letter-spacing:-.01em;margin-top:3px;color:var(--ink)}
.mw .s{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mw:hover .l{color:var(--ink)}
.mw:hover .num{text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:5px}
.mw.err .num{color:var(--t-out)}
.mw.err .l{color:var(--t-out)}
.fnote{border-left:2px solid var(--line-2);padding:2px 12px;font-size:13px;color:var(--ink-2);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fnote b{color:var(--ink)}
.lp .tbl a.cl,.lp .tbl a.jn{color:inherit}
.lp .tbl a.cl:hover,.lp .tbl a.jn:hover{color:var(--ink);text-decoration:underline}
.lp .tbl tr.void td,.lrow.void{opacity:.55}
.lp .tbl .sub.w{color:var(--warn)}.lp .tbl .sub.e{color:var(--t-out)}
.lp .tbl tr.gh td{color:var(--ink-2)}
.fw .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:500;margin-left:5px}
.lphead .fw.on .n{color:var(--muted)}
.chasebox{width:100%;min-height:200px;max-height:300px;resize:vertical;font:13px/1.5 var(--sans);color:var(--ink);background:var(--paper-2);border:1px solid var(--control-line);border-radius:10px;padding:10px 12px}
.pick{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 8px;border-top:1px solid var(--line);text-align:left;color:inherit;border-radius:0}
.pick:hover,.pick.first{background:var(--paper-2)}
.pick .sub{margin:0}
@media (max-width:859px){
  .mwords{grid-template-columns:1fr 1fr;gap:12px 16px;padding:12px 16px 14px}
  .mw{padding:0}
  .mw .num{font-size:21px}
  .fnote{margin:8px 16px 0}
  .pick{min-height:56px}
}
</style>
<div class="lphead">
  <div><h1 class="h1">Finance</h1><div class="sub deskonly">Quotes and invoices across every job · <span class="kbd">/</span> search · <span class="kbd">n</span> new</div></div>
  <div style="flex:1"></div>
  <div class="ib deskonly" id="kindsw" style="gap:14px;margin-right:8px"></div>
  <button class="btn btn-primary deskonly" data-act="new">+ New ▾</button>
  <button class="btn btn-icon deskonly" data-act="pagemenu" aria-label="More">⋯</button>
</div>
<div class="segrow phoneonly" id="kindrow"></div>
<div id="xnote"></div>
<div class="mwords" id="mwords"></div>
<div class="segrow" id="strip"></div>
<div class="ftoolbar">
  <div class="search"><span class="muted">⌕</span><input id="q" placeholder="Search" aria-label="Search"></div>
  <div class="fstrip"><div id="fwords" style="display:contents"></div><div class="spacer"></div><div id="views"></div></div>
</div>
<div class="tblwrap" id="tblwrap"></div>
<div class="list" id="list"></div>
<div class="lpfoot" id="foot"></div>
<div class="phoneact" id="phoneact"><button class="btn btn-primary" data-act="new">+ New ▾</button></div>
