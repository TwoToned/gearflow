name: Link Check

# Markdown link checker (POLICY.md R-5.7). Advisory (fail: false) — surfaces broken
# links without blocking; flip to failing once the current set is clean.
on:
  pull_request:
    paths: ["**/*.md"]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--no-progress --exclude-loopback --exclude-path node_modules './**/*.md'"
          fail: false
