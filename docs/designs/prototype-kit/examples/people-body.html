<style>
/* people lists — only what the kit's list shell lacks */
.lp .tbl td .two{min-width:0}
.lp .tbl td .sub,.lrow .sub{font-size:12px;color:var(--muted);margin-top:2px}
.lp .tbl .who{display:flex;align-items:center;gap:10px;min-width:0}
.lp .tbl .who>div{min-width:0}
.lp .tbl td.r .sub{text-align:right}
.lp .tbl td a.jl{color:var(--blue);font-weight:600;font-size:12px}
.lp .tbl td a.jl:hover{text-decoration:underline}
.dotw.faint{color:var(--faint)}
.flags{display:inline-flex;gap:10px;margin-left:10px}
.nav a .patch{flex:none}
.phonehead .ttlbtn{font-family:var(--display);font-weight:800;font-size:16px;color:var(--ink);display:inline-flex;align-items:center;gap:6px;max-width:100%}
.phonehead .ttlbtn i{font-style:normal;color:var(--muted);font-size:11px}
.dlg textarea{width:100%;min-height:72px;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--control-line);border-radius:10px;padding:8px 12px;resize:vertical}
.dlg select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--control-line);border-radius:10px;height:36px;padding:0 10px;width:100%}
.rad{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;cursor:pointer}
.rad:first-child{border-top:0}
.rad input{width:auto;height:auto;accent-color:var(--action-red)}
.rad .sub{margin:0 0 0 auto;font-size:12px;color:var(--muted)}
@media (max-width:859px){
  .dlg select,.dlg textarea{font-size:16px}
  .lrow .dots{margin-right:-8px}
  .lrow .right{min-width:64px}
}
</style>
<div class="lphead">
  <div><h1 class="h1"><span id="title"></span><span class="cnt" id="count"></span></h1><div class="sub deskonly" id="headsub"></div></div>
  <div style="flex:1"></div>
  <button class="btn btn-primary deskonly" data-act="new" id="primary"></button>
  <button class="btn btn-icon deskonly" data-act="pagemenu" aria-label="More">⋯</button>
</div>
<div class="segrow" id="strip"></div>
<div class="ftoolbar">
  <div class="search"><span class="muted">⌕</span><input id="q" aria-label="Search"></div>
  <div class="fstrip"><div id="fwords" style="display:contents"></div><div class="spacer"></div><div id="views"></div></div>
</div>
<div class="tblwrap" id="tblwrap"></div>
<div class="list" id="list"></div>
<div class="lpfoot" id="foot"></div>
<div class="phoneact" id="phoneact"><button class="btn btn-primary" data-act="new" id="phoneprimary"></button></div>
