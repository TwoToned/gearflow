name: Deploy GearFlow
 
on:
  push:
    branches:
      - main
 
jobs:
  deploy:
    name: Pull, Migrate & Restart
    runs-on: self-hosted
    timeout-minutes: 15
 
    steps:
      - name: Pull latest code
        run: |
          cd ${{ vars.APP_DIR }}
          git pull origin main
 
      - name: Install dependencies
        run: |
          cd ${{ vars.APP_DIR }}
          npm ci --ignore-scripts --legacy-peer-deps
 
      - name: Generate Prisma client
        run: |
          cd ${{ vars.APP_DIR }}
          npx prisma generate

      - name: Run tests
        run: |
          cd ${{ vars.APP_DIR }}
          npm test

      - name: Run Prisma migrations
        run: |
          cd ${{ vars.APP_DIR }}
          npx prisma migrate deploy
 
      - name: Build Next.js app
        run: |
          cd ${{ vars.APP_DIR }}
          npm run build
 
      - name: Restart app + Discord bot
        run: |
          cd ${{ vars.APP_DIR }}
          # Web app: unchanged, proven path.
          pm2 restart gearflow
          # Discord bot: separate process. startOrReload starts it on first
          # deploy and gracefully reloads it thereafter (--only scopes to the bot
          # so the web app config above is never touched by this file).
          pm2 startOrReload ecosystem.config.js --only gearflow-discord-bot --update-env
          # Persist the process list so a box reboot brings both back.
          pm2 save
 
