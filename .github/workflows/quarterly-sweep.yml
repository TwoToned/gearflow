name: Quarterly Sweep

# Recurring hygiene sweep (POLICY.md R-12.1 / §12). Runs the automatable checks and
# opens a tracking issue with the results + a manual checklist.
on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *" # 09:00 UTC on the 1st of Jan/Apr/Jul/Oct
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret sweep

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run sweep
        run: bash scripts/quarterly-sweep.sh > sweep-report.md || true

      - name: Open sweep issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Quarterly hygiene sweep — $(date -u '+%Y-%m-%d')" \
            --label "hygiene-audit" \
            --body-file sweep-report.md

      # Blocking (unlike the report step above): critical docs (architecture,
      # onboarding, runbooks) MUST be reviewed at least quarterly (R-5.5 / T-14).
      # A red run here is the alert — the sweep issue above already has the details.
      - name: Critical doc review-cadence gate (R-5.5 / T-14)
        run: pnpm run check-docs-review-cadence
