<style>
/* home · calm — Overview's rhythm: hairlines, dot-words, no card chrome */
.hm{width:100%;max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hm .lphead{margin-bottom:2px}
.shd{display:flex;align-items:baseline;gap:8px;margin:0 0 2px;font-size:13px;font-weight:600;color:var(--ink)}
.shd .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:500}
.shd .sright{margin-left:auto;display:inline-flex;gap:14px;align-items:baseline}
.gl{font-size:12px;font-weight:600;color:var(--muted);padding:16px 0 2px;display:flex;gap:8px;align-items:baseline}
.gl .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:500}
.gl.first{padding-top:6px}
.gl a{color:inherit}.gl a:hover{color:var(--ink)}
.lnk.mutedl{color:var(--muted)}
/* setup panel */
.setup{border-left:2px solid var(--line-2);padding:2px 0 2px 16px;margin:6px 0 4px}
.setup .prog{margin:8px 0 2px;max-width:360px}
.prog{display:flex;gap:4px}
.prog i{display:block;flex:1;height:3px;border-radius:2px;background:var(--line-2)}
.prog i.d{background:var(--ink-2)}
.todo{list-style:none;margin:6px 0 0;padding:0}
.todo li a{display:flex;align-items:center;gap:12px;padding:8px 0;color:var(--ink);font-size:13.5px;border-top:1px solid var(--line)}
.todo .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.todo .grow{flex:1;min-width:0}
/* stat words */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding:20px 0 22px;border-bottom:1px solid var(--line)}
.stat{display:block;color:var(--ink);position:relative;min-width:0}
.stat .n{display:block;font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{display:block;font-size:13px;font-weight:600;margin-top:8px}
.stat .s{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.stat:hover .l{text-decoration:underline}
.stat.bad .n{color:var(--t-out)}
.stat::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 2px);z-index:5;display:none;white-space:nowrap;padding:5px 9px;border-radius:8px;background:var(--elev);border:1px solid var(--line-2);font-family:var(--mono);font-size:11.5px;color:var(--ink-2);box-shadow:var(--sh-hover);pointer-events:none}
.stat:hover::after,.stat:focus-visible::after{display:block}
.stats.solo{grid-template-columns:repeat(auto-fit,minmax(120px,160px))}
/* columns */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;padding-top:18px}
.cols.one{grid-template-columns:minmax(0,560px)}
.cols+.cols{border-top:1px solid var(--line);margin-top:14px;padding-top:20px}
.col{min-width:0}
/* rows (hairline, no cards) */
.hrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:54px}
.hmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:9px 0;color:var(--ink)}
.hmain:hover .ttl{text-decoration:underline}
.hmain .grow{flex:1;min-width:0}
.ttl{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4;display:block}
.ttl .id,.id{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.hrow .sub,.nrow .sub,.arow .sub,.trow .sub{font-size:12.5px;color:var(--muted);margin-top:1px;line-height:1.4}
.where,.rt{font-size:12.5px;color:var(--muted);white-space:nowrap;flex:none}
.rt.mono{font-family:var(--mono)}
.hrow:hover .dots,.trow:hover .dots,.nrow:hover .dots,.arow:hover .dots{opacity:1}
.more{padding:8px 0 0;border-top:1px solid var(--line)}
.calmmsg{padding:14px 0;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line)}
.calmmsg b{color:var(--ink);font-weight:600}
/* tasks */
.trow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);min-height:52px}
.trow .vc{flex:none}
.trow .cb{flex:none}
.trow.closed .ttl{text-decoration:line-through;color:var(--muted)}
.trow.sel,.nrow.sel{background:var(--select);margin:0 -8px;padding-left:8px;padding-right:8px}
.tmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);margin-top:1px}
.tmeta .late{color:var(--t-out)}.tmeta .today{color:var(--warn)}
.tmeta .hi{color:var(--t-out)}
/* notifications */
.nrow{display:flex;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line);min-height:60px}
.nrow.read .ttl{font-weight:500;color:var(--ink-2)}
.nrow.read .dotw{color:var(--faint)}
.nrow .when,.arow .when{font-family:var(--mono);font-size:12px;color:var(--faint);flex:none}
/* activity */
.arow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:50px}
.arow .hmain{gap:10px}
.arow .atxt{font-size:13.5px;line-height:1.4;color:var(--ink-2);display:block}
.arow .atxt b{color:var(--ink);font-weight:600}
.ini{width:22px;height:22px;border-radius:50%;background:var(--elev);color:var(--ink-2);font-family:var(--display);font-weight:700;font-size:9.5px;display:inline-flex;align-items:center;justify-content:center;flex:none;letter-spacing:.02em}
.ini.agent{background:transparent;border:1px dashed var(--control-line);color:var(--muted)}
.fw.scope.on::after{content:'✕'}
.sw{border:0}
.wrow{display:flex;align-items:center;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .grow{flex:1;min-width:0}
.wrow .ttl{font-size:13.5px}
.wrow .sub{font-size:12px;color:var(--muted);margin-top:1px}
.gtitle{font-size:12px;font-weight:600;color:var(--muted);padding:10px 0 2px}
.phonetabs{padding:8px 16px 4px}
@media (max-width:859px){
  .hm{padding:0;gap:0;flex:1}
  .page.lp{min-height:100%}
  #v-home,#v-tasks,#v-notes,#v-activity{padding:0 16px}
  .stats{grid-template-columns:1fr 1fr;gap:18px 20px;padding:16px 0 18px}
  .stat::after{display:none!important}
  .cols,.cols.one{grid-template-columns:minmax(0,1fr);gap:8px;padding-top:12px}
  .cols+.cols{margin-top:10px;padding-top:12px}
  .hrow{min-height:64px}
  .hrow .where{display:none}
  .nrow{min-height:64px}
  .trow{min-height:60px}
  .arow{min-height:60px}
  .vc{width:22px;height:22px}
  .trow .cb,.nrow .cb{width:22px;height:22px;border-radius:6px}
  .dots{width:40px;height:40px}
  .setup{margin:10px 0 4px}
  .phoneact{margin-top:auto}
  .lpfoot{padding:10px 16px}
  .ftoolbar{padding:8px 16px}
  .phonetabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 16px 6px}
  .phonetabs::-webkit-scrollbar{display:none}
  .phonetabs .chip{flex:none;height:32px;padding:0 12px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);border-radius:999px;font-size:13px;font-weight:600}
  .phonetabs .chip.on{background:var(--elev);color:var(--ink);border-color:var(--control-line)}
  .segrow{padding:0 16px}
  .gl{padding-top:14px}
  .shd{margin-top:6px}
}
</style>
<div class="hm">
<div class="lphead">
  <div style="min-width:0"><h1 class="h1" id="h1"></h1><div class="sub deskonly" id="hsub"></div></div>
  <div style="flex:1"></div>
  <div class="ib deskonly" id="viewsw" style="gap:16px;margin-right:8px"></div>
  <a class="btn btn-primary deskonly" id="primary" data-act="primary" href="#"></a>
  <button class="btn btn-icon deskonly" data-act="pagemenu" aria-label="More">⋯</button>
</div>
<div class="phonetabs" id="phonetabs"></div>
<div class="segrow" id="strip"></div>
<div class="ftoolbar" id="toolbar">
  <div class="search"><span class="muted">⌕</span><input id="q" placeholder="Search activity, people or records" aria-label="Search activity"></div>
  <div class="fstrip"><div id="fwords" style="display:contents"></div><div class="spacer"></div><div id="views"></div></div>
</div>
<div id="v-home"></div>
<div id="v-tasks"></div>
<div id="v-notes"></div>
<div id="v-activity"></div>
<div class="lpfoot" id="foot"></div>
<div class="phoneact" id="phoneact"><a class="btn btn-primary" id="phoneprimary" data-act="primary" href="#"></a></div>
</div>
