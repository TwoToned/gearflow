<style>
/* forms gallery + RowEditorSheet (copied from the asset prototype's sheet) */
.lp .tbl td .sub,.lrow .sub{font-size:12px;color:var(--muted);margin-top:2px}
.lp .tbl td.rt2{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.lp .tbl td .arrow{color:var(--faint);margin:0 6px}
.lp .tbl td .nm{font-weight:600}
.lp .tbl tr.row .go{color:var(--faint);font-size:12px;opacity:0}
.lp .tbl tr.row:hover .go{opacity:1}
.dotw.faint{color:var(--faint)}
.phonehead .ttl{font-family:var(--display);font-weight:800;font-size:16px}
.dlg .field{gap:5px}
.dlg select,.dlg textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--control-line);border-radius:10px;height:36px;padding:0 10px;min-width:0}
.dlg textarea{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
.dlg input[type=date]{color-scheme:dark}
.dlg input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--action-red);flex:none}
.dlg .bd{gap:0;flex:1;min-height:0}
.dlg .field.bad input,.dlg .field.bad select,.dlg .field.bad textarea{border-color:var(--t-out)}
.err{font-size:11.5px;color:var(--t-out)}
.fsec{padding:14px 0 2px;border-top:1px solid var(--line)}
.fsec:first-child{border-top:0;padding-top:0}
.fsec .fh{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.fsec .fh b{font-size:12.5px}
.fsec .fh span{font-size:12px;color:var(--muted)}
.fsec>.field,.fsec>.g2,.fsec>.g3,.fsec>.chk,.fsec>.words{margin-bottom:12px}
.fsec>.chk+.chk{margin-top:-4px}
.chk{display:flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer}
.words{display:flex;gap:16px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wd{height:28px;padding:0 1px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.wd:hover{color:var(--ink)}
.wd.on{color:var(--ink);border-bottom-color:var(--action-red)}
.fsec .words{border-bottom:0;margin-bottom:12px}
.fsec .words .wd{border-bottom-width:2px}
.pk{position:relative}
.pkl{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--elev,var(--card));border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--sh-hover);padding:4px;max-height:230px;overflow:auto;display:none}
.pkl.open{display:block}
.res2{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;width:100%;text-align:left;color:inherit}
.res2:hover,.res2.on{background:var(--select)}
.res2 .tg{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto;flex:none}
.res2 .nm2{font-weight:600;font-size:13.5px}
.pkl .none{padding:10px;font-size:13px;color:var(--muted)}
.crow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;min-height:44px}
.crow .grow{flex:1;min-width:0}
.crow .id{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);flex:none}
.crow .m{font-size:12px;color:var(--muted)}
.crow input,.crow select{height:30px;width:70px;padding:0 8px;flex:none}
.crow select{width:170px}
.crow .x{width:28px;height:28px;color:var(--muted);border-radius:8px;flex:none}
.crow .x:hover{color:var(--ink);background:var(--paper-2)}
.crows{margin-bottom:12px}
.minif{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 0 4px;border-top:1px solid var(--line)}
.minif .full{grid-column:1/-1;display:flex;gap:12px;align-items:center}
.dlg.small{width:min(440px,calc(100% - 32px))}
.dlg .ft .again{}
.dlg .ft .gh{color:var(--muted);font-size:12.5px;font-weight:600}
.discard{flex:1;font-size:13px;color:var(--ink)}
.cnote{font-size:12px;color:var(--muted);margin:-6px 0 12px}
@media (max-width:859px){
  .page.lp{padding:0}
  .dlg.sheet{height:calc(100% - 8px);max-height:none;border-radius:20px 20px 0 0}
  .dlg .field input,.dlg select,.dlg textarea,.minif input{font-size:16px}
  .dlg .hd{padding:16px 16px 10px}.dlg .bd{padding:12px 16px}
  .dlg .ft{flex-wrap:wrap;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));gap:8px}
  .dlg .ft .btn{height:44px}
  .dlg .ft .btn-primary{flex:1}
  .dlg .ft .again{order:-1;flex:0 0 100%;background:none;border:0;box-shadow:none;color:var(--blue);height:32px;padding:0;justify-content:flex-start}
  .dlg .ft .sp{display:none}
  .dlg .ft .btn-secondary:not(.again){flex:0 0 auto;min-width:96px}
  .dlg.small{width:100%}
  .lrow .sub{white-space:normal}
}
</style>
<div class="lphead">
  <div><h1 class="h1">Forms<span class="cnt" id="count"></span></h1><div class="sub deskonly">every create and edit sheet, one component</div></div>
  <div style="flex:1"></div>
  <button class="btn btn-primary deskonly" data-act="newjob">New job ↗</button>
  <button class="btn btn-icon deskonly" data-act="pagemenu" aria-label="More">⋯</button>
</div>
<div class="ftoolbar">
  <div class="search"><span class="muted">⌕</span><input id="q" aria-label="Search" placeholder="Search forms — client, crew, asset…"></div>
</div>
<div class="tblwrap" id="tblwrap"></div>
<div class="list" id="list"></div>
<div class="lpfoot" id="foot"></div>
<div class="phoneact" id="phoneact"><button class="btn btn-primary" data-act="newjob">New job ↗</button></div>
