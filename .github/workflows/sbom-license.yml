name: SBOM & License

# Software Bill of Materials + license compliance (POLICY.md R-6.8).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"

# Least-privilege default (OSSF Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 30

  license:
    name: License check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Blocking deny-list check for copyleft/non-commercial licenses in prod deps
      # (tree confirmed clean; the check only fails on a genuinely denied license).
      - name: Check licenses (deny GPL/AGPL/SSPL/non-commercial)
        run: |
          pnpm licenses list --prod --json > licenses.json || echo '{}' > licenses.json
          node -e '
            let data = {};
            try { data = require("./licenses.json"); } catch { process.exit(0); }
            const deny = /(^|[^L])GPL|AGPL|SSPL|CC-BY-NC|BUSL/i;
            const bad = [];
            for (const [lic, pkgs] of Object.entries(data)) {
              if (deny.test(lic)) {
                const names = Array.isArray(pkgs) ? pkgs.map(p => p.name || p).join(", ") : String(pkgs);
                bad.push(`${lic}: ${names}`);
              }
            }
            if (bad.length) { console.error("Denied licenses found:\n" + bad.join("\n")); process.exit(1); }
            console.log("No denied licenses in prod dependencies.");
          '
