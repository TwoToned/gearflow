<style>
/* settings · index + record sections (calm) */
.set{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column}
.set .lphead{margin-bottom:2px}
.set .t{flex:1 1 320px;min-width:0}
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.trow .h1{font-size:26px}
.idl{font-size:13px;color:var(--muted);margin-top:4px;max-width:62ch}
.hact{display:flex;align-items:center;gap:8px;margin-left:auto}
.gh{display:flex;align-items:baseline;gap:8px;padding:26px 0 8px}
.gh b{font-size:12.5px;font-weight:600;color:var(--ink)}
.gh .n,.sxh .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-weight:500}
.irow{display:grid;grid-template-columns:190px minmax(0,1fr) auto 14px;gap:18px;align-items:center;min-height:52px;width:100%;padding:0 4px;border-top:1px solid var(--line);text-align:left;color:inherit;cursor:pointer;background:transparent}
.irow:hover{box-shadow:inset 2px 0 0 var(--red)}
.irow .nm{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .ds{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.irow .ds em{font-style:normal;color:var(--faint)}
.irow .st{justify-self:end;text-align:right}
.irow .chv{color:var(--faint);font-size:15px}
.irow:hover .chv{color:var(--ink)}
.irow.kid{min-height:44px}
.irow.kid .nm{font-weight:500;color:var(--ink-2);padding-left:16px}
.irow.kid .nm::before{content:'';display:inline-block;width:8px;height:8px;border-left:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin:0 8px 3px -14px}
.sx{padding:22px 0 10px;border-top:1px solid var(--line)}
.sx:first-of-type{border-top:0}
.sxh{display:flex;align-items:center;gap:8px;min-height:28px;margin-bottom:6px;flex-wrap:wrap}
.sxh h2{font-family:var(--sans);font-size:13px;font-weight:600;margin:0;letter-spacing:0}
.sxh .r{margin-left:auto;display:flex;align-items:center;gap:14px}
.sxh .search{min-width:150px;height:28px;border:0;background:transparent;padding:0}
.sxh .search input{font-size:13px;border:0;background:transparent;padding:0;height:28px;width:150px}
.ftoolbar .search input{width:360px;border:0;background:transparent;padding:0}
.tbl td.jn{font-size:12px;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 6px}
.emptyl{padding:14px 4px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.emptyl b{color:var(--ink);font-weight:600}
.tbl .who{display:flex;align-items:center;gap:12px;min-width:0}
.tbl .who .av,.lrow .av{width:28px;height:28px;font-size:11px;border-width:0;box-sizing:border-box}
.lrow .av{width:36px;height:36px;font-size:13px}
.av.inv{background:transparent;border:1px dashed var(--control-line);color:var(--muted)}
.rolew{font-size:13.5px;color:var(--ink-2);padding:0;font-weight:500;display:inline-flex;align-items:center;gap:4px}
button.rolew:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.rolew.owner{color:var(--ink);font-weight:600}
.cb.dis{opacity:.35;cursor:default}
/* join policy radios */
.rdo{display:grid;grid-template-columns:18px 1fr;gap:12px;align-items:start;width:100%;text-align:left;padding:12px 4px;border-top:1px solid var(--line);color:inherit}
.rdo .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--control-line);margin-top:1px;position:relative;background:var(--paper-2)}
.rdo.on .dot{border-color:var(--ink)}
.rdo.on .dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.rdo b{font-size:13.5px;font-weight:600;display:block}
.rdo span.d{font-size:12.5px;color:var(--muted);display:block;margin-top:2px}
.rdo:disabled{opacity:.6}
.rdo.rect{padding:10px 4px}
/* matrix */
.mxwrap{overflow-x:auto}
.mx{width:100%;border-collapse:collapse;table-layout:fixed}
.mx th{font-size:12px;font-weight:600;color:var(--ink);text-align:center;padding:6px 4px;border-bottom:1px solid var(--line-2);vertical-align:bottom}
.mx th:first-child{text-align:left;width:236px;color:var(--muted);font-weight:600}
.mx th button{font:inherit;color:inherit}
.mx th button:hover{text-decoration:underline;text-underline-offset:3px}
.mx th .sub{font-size:11px;font-weight:500;margin-top:1px}
.mx td{padding:0 4px;height:38px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12.5px;text-align:center;color:var(--muted)}
.mx td:first-child{text-align:left;font-family:var(--sans);font-size:13.5px;color:var(--ink);font-weight:500}
.mx td.all{color:var(--ink)}
.mx td.none{color:var(--faint)}
.mx tr.res{cursor:pointer}
.mx tr.res:hover td:first-child{box-shadow:inset 2px 0 0 var(--red)}
.mx tr.res .chv{display:inline-block;width:14px;color:var(--faint);font-size:11px;transition:transform .12s}
.mx tr.res.open .chv{transform:rotate(90deg)}
.mx tr.res .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:6px;font-weight:500}
.mx tr.act td{height:32px;background:transparent;font-size:12.5px}
.mx tr.act td:first-child{padding-left:30px;color:var(--ink-2);font-weight:400;font-size:13px}
.mx tr.act td svg{color:var(--ink-2)}
.mx tfoot td{height:40px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
.mx tfoot td:first-child{font-size:12.5px;color:var(--muted);font-weight:600}
.rolesl{display:none}
/* role sheet */
.rrow{padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .rh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rrow .rh b{font-size:13.5px;font-weight:600}
.rrow .rh .allb{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.rrow .rh .allb:hover{color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px 18px}
.acts label{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);cursor:pointer;min-width:84px}
.acts label.off{color:var(--faint)}
.acts label.lk{cursor:default;opacity:.6}
.acts .cb{width:16px;height:16px}
.acts .cb.on{background:var(--ink-2);border-color:var(--ink-2)}
.acts .cb.on::after{border-color:var(--paper)}
.quiet{padding:10px 14px;border-radius:12px;background:var(--paper-2);font-size:13px;color:var(--ink-2);line-height:1.5}
.quiet b{color:var(--ink)}
.stubrow{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:12px 4px;border-top:1px solid var(--line);font-size:13.5px}
.stubrow b{font-weight:600}
.stubrow span{color:var(--muted)}
.denied{padding:90px 16px;text-align:center}
.denied h2{font-family:var(--display);font-size:20px;margin:0 0 6px}
.denied p{color:var(--muted);margin:0 0 14px}
.warnw{color:var(--warn)}
.sidebar .foot a.on{background:var(--blue-soft);color:var(--info)!important;border-radius:10px;font-weight:600;box-shadow:var(--sh-card)}
#dirty{z-index:5}
.rd2{display:grid;grid-template-columns:18px 1fr;gap:12px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);color:inherit}
.rd2:first-child{border-top:0}
.rd2 .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--control-line);margin-top:1px;position:relative;background:var(--paper-2)}
.rd2.on .dot{border-color:var(--ink)}
.rd2.on .dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.rd2 b{font-size:13.5px;font-weight:600;display:block}.rd2 span.d{font-size:12.5px;color:var(--muted)}
.ferr{font-size:12px;color:var(--t-out)}
@media (max-width:859px){
  .set{padding:0;margin-top:-14px}
  .set .sx,.set .gh,.set .idl-p{padding-left:16px;padding-right:16px}
  .gh{padding-top:20px}
  .irow{grid-template-columns:minmax(0,1fr) auto 14px;grid-template-areas:"n s c" "d d c";gap:2px 10px;min-height:64px;padding:10px 16px}
  .irow .nm{grid-area:n;font-size:15px}
  .irow .ds{grid-area:d;font-size:12.5px}
  .irow .st{grid-area:s;font-size:12px}
  .irow .chv{grid-area:c;align-self:center}
  .irow.kid{min-height:56px}
  .irow.kid .nm{padding-left:14px}
  .irow.kid .nm::before{margin-left:-12px}
  .emptyl,.rdo{padding-left:0;padding-right:0}
  .mxwrap{display:none}
  .rolesl{display:block}
  .sxh .r{margin-left:0;flex:1 1 100%}
  .sxh .search{flex:1}
  .sxh .search input{width:100%}
  .stubrow{grid-template-columns:1fr;gap:2px}
  .quiet{margin:0 16px}
  .set>.quietwrap{padding:0}
  body.hasdirty .phoneact{display:none}
  .acts label{min-width:46%}
  .denied{padding:60px 16px}
}
</style>
<div class="set" id="view"></div>
<div class="phoneact" id="phoneact"></div>
