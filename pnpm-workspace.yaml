# pnpm workspace configuration.
#
# Previously this file was kept untracked per-checkout, so pnpm settings (build-script
# approvals, release-age excludes) and — critically — dependency `overrides` were not
# committed and did not ship reproducibly. Tracking it fixes that (supports POLICY.md
# R-6.1/R-6.2 reproducible installs). NOTE for anyone with a local untracked copy: delete
# it before pulling so git can check this tracked version out.

# Security overrides (POLICY.md R-6.6 — zero known high/critical at merge). All transitive;
# these force the patched versions without risky major bumps of the direct deps:
#   serialize-javascript  (next-pwa build)   <7.0.3
#   hono                  (prisma dev tools)  <4.12.25
#   ws                    (convex runtime)    8.0.0–8.20.x
#   brace-expansion       (next-pwa/eslint/shadcn transitive) multiple ranges <5.0.9
#                          — GHSA-rgw5-rvv9-x895 (2026-09-03 audit, supersedes the
#                          earlier <5.0.8 floor, which a new advisory caught up to —
#                          it bypasses the CVE-2026-14257 mitigation that floor covered)
#   js-yaml               (shadcn>cosmiconfig)  <5.2.2 — GHSA-pm4m-ph32-ghv5
#                          (2026-07-24 audit, supersedes the earlier <4.3.0 floor —
#                          cosmiconfig has since moved to a js-yaml 5.x requirement)
#   fast-uri              (better-auth>prisma dev tooling, via ajv)  <4.1.3 —
#                          GHSA-7p8r-x3mc-p8w7 / GHSA-fph4-wmhf-6fwf / GHSA-f65p-4m7j-42xc /
#                          GHSA-jqff-g426-hqxp (2026-09-03 audit, supersedes the earlier
#                          <3.1.4 floor — ajv's own fast-uri requirement has since moved
#                          to ^4.0.0, so the old floor no longer intercepted anything)
#   sharp                 (next's own optional dep, pulled in nested under
#                          better-auth/next-pwa>next)  <0.35.0 — the direct
#                          "sharp" entry in package.json is already >=0.35.0;
#                          this only forces the nested copies under next.
#   postcss               (next's own vendored copy — next@16.2.11 pins 8.4.31
#                          internally; the project's own postcss, via
#                          @tailwindcss/postcss, already resolves to a patched
#                          8.5.21) <8.5.12 — GHSA-6g55-p6wh-862q
#   find-my-way           (prisma dev tooling, @prisma/dev — local Postgres
#                          emulation only, not shipped) <9.6.1 — GHSA-c96f-x56v-gq3h
#   @hono/node-server     (shadcn>@modelcontextprotocol/sdk, CLI dev tool only,
#                          not shipped) <2.0.5 — GHSA-frvp-7c67-39w9 (Windows-only
#                          path traversal in serve-static)
#   valibot               (prisma dev tooling, @prisma/dev) <=1.4.1 —
#                          GHSA-5qjj-4xww-7phc
#   undici                (jsdom, test env only — vitest/jsdom)  <7.29.0 —
#                          GHSA-4cwx-7wf7-3272 (2026-09-03 audit). Previously left to
#                          the resolver because it naturally landed on the patched
#                          7.28.0 and a forced override broke jsdom's resource
#                          dispatcher — a newer advisory caught up to 7.28.0 too, so
#                          it's now pinned explicitly (re-verify jsdom still passes).
#   nanoid                (postcss, dev tooling only)  <3.3.18 — GHSA-2v37-7h3g-55p8
#                          (2026-09-03 audit): custom generators can loop indefinitely
#                          when size is zero.
#   deepmerge-ts           (prisma dev tooling, @prisma/config)  <8.0.0 —
#                          stack exhaustion merging recursive object graphs
#                          (2026-09-03 audit).
#   mysql2                 (better-auth's optional MySQL adapter — this project uses
#                          Postgres only, adapter code never runs, but the dependency
#                          still ships)  <3.22.0 — auth-plugin downgrade leaks
#                          plaintext credentials (2026-09-03 audit).
#   undici (8.x line)      (jsdom — test tooling only)  >=8.0.0 <8.12.2 — four high
#                          advisories: GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26,
#                          GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm (2026-10-28 audit).
#                          pnpm applies ONE override per request, and the <7.29.0 floor
#                          above matches shadcn's and @dotenvx/dotenvx's ^7 requests
#                          first. That floor was unbounded, so it parked them on whatever
#                          8.x was newest at the time (8.10.2 / 8.11.2 — both vulnerable);
#                          it is now capped at <8 so they take the patched 7.30.1, and this
#                          selector covers the requests that really are for 8.x.
#   dompurify              (@pdfme/schemas, posthog-js)  <3.4.17 — GHSA-mrv2-3pqr-j5jr
#                          plus one more at critical (2026-10-28 audit). Both
#                          copies were on the 3.4 line; 3.4.17 is the first fix.
#   body-parser            (express 5, via @modelcontextprotocol/sdk)  >=2.0.0 <2.4.0 —
#                          GHSA-27r3-jxmh-p828, DoS via trailing bytes after a
#                          compressed request body (2026-10-28 audit).
#   vite                   (vitest, test tooling only)  >=8.0.0 <8.1.6 — high advisory
#                          (2026-10-28 audit). Held to the 8.1 minor (~8.1.6) so test
#                          tooling does not jump to 8.3 as a side effect of a security fix.
#                          Re-bumping it: pnpm will not move an already-locked vite for the
#                          range form alone — set the override to the exact version, run
#                          `pnpm install`, then restore the range.
#   zod (transitive)       (shadcn's nested @modelcontextprotocol/sdk, zod-to-json-schema,
#                          @pdfme/common, knip, eslint-plugin-react-hooks…)  <4.6.6 —
#                          GHSA-mrhx-c7xc-m3w5, memory exhaustion on oversized
#                          constrained collections (2026-10-28 audit). The direct "zod"
#                          dependency is bumped in package.json; this catches the nested
#                          copies, including a 3.25.76 that no 3.x release can fix. Every
#                          dependent of those copies declares "^3.25 || ^4" or "^4".
overrides:
  serialize-javascript@<7.0.3: '>=7.0.3'
  hono@<4.12.25: '>=4.12.25'
  ws@>=8.0.0 <8.21.0: '>=8.21.0'
  brace-expansion@<5.0.12: '>=5.0.12'
  js-yaml@<5.2.2: '>=5.2.2'
  fast-uri@<4.1.3: '>=4.1.3'
  sharp@<0.35.5: '>=0.35.5'
  source-map-js@<1.2.2: '>=1.2.2'
  proxy-addr@<2.0.8: '>=2.0.8'
  '@modelcontextprotocol/sdk@<1.31.0': '>=1.31.0'
  postcss: '>=8.5.12'
  find-my-way: '>=9.6.1'
  '@hono/node-server': '>=2.0.5'
  valibot: '>=1.4.2'
  undici@<7.29.0: '>=7.29.0 <8'
  nanoid@<3.3.18: '>=3.3.18'
  deepmerge-ts@<8.0.0: '>=8.0.0'
  mysql2@<3.22.0: '>=3.22.0'
  next@<16.3.8: '>=16.3.8'
  '@xmldom/xmldom@<0.8.15': '>=0.8.15 <0.9.0'
  undici@>=8.0.0 <8.12.2: '>=8.12.2 <9'
  dompurify@<3.4.17: '>=3.4.17 <4'
  body-parser@>=2.0.0 <2.4.0: '>=2.4.0 <3'
  vite@>=8.0.0 <8.1.6: '>=8.1.6 <8.2.0'
  zod@<4.6.6: '>=4.6.6 <5'

# Packages allowed to run install/build lifecycle scripts (pnpm blocks these by default —
# supports R-6.7 install-script hardening).
allowBuilds:
  '@posthog/cli': true
  '@prisma/client': true
  '@prisma/engines': true
  canvas: true
  core-js: true
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Supply-chain hardening (POLICY.md R-6.7): don't adopt a dependency version until it has
# been public for ≥24h (1440 min) — mitigates compromised just-published releases. Only
# affects resolution/updates; `--frozen-lockfile` installs are unaffected.
minimumReleaseAge: 1440

# Packages excluded from the minimum-release-age gate (first-party pinned versions we
# adopt immediately).
minimumReleaseAgeExclude:
  - '@better-auth/core@1.6.15'
  - '@better-auth/drizzle-adapter@1.6.15'
  - '@better-auth/kysely-adapter@1.6.15'
  - '@better-auth/memory-adapter@1.6.15'
  - '@better-auth/mongo-adapter@1.6.15'
  - '@better-auth/passkey@1.6.15'
  - '@better-auth/prisma-adapter@1.6.15'
  - '@better-auth/sso@1.6.15'
  - '@better-auth/telemetry@1.6.15'
  - better-auth@1.6.15

# Audit ignore list — every entry MUST have a matching, dated row in docs/exceptions.md (§15).
#   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3 stack-exhaustion DoS. Advisory says fixed in 3.0.4,
#                        which is not published (3.0.3 is latest) so an override cannot fix
#                        it. Dev/build tooling only (next-pwa build, eslint-config-next,
#                        shadcn CLI) — never in the runtime bundle. Remove once braces ships.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
