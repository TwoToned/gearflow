name: DORA metrics

# Track the five DORA metrics at the project level (POLICY.md R-11.1), computed from
# GitHub Actions deploy runs + git — no external platform. Results land in the run's
# job summary each Monday (and on demand).
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dora:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Compute DORA metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/dora-metrics.mjs | tee -a "$GITHUB_STEP_SUMMARY"
